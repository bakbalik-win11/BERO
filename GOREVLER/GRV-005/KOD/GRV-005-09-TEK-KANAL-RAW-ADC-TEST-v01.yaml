# PROJE BERO — GRV-005-09
# HEDEF: Tek kanalda raw ADC çıktısını doğrulamak
# KANAL: GPIO33 / 1T
# DURUM: Kullanıcı derleme başarısını bildirdi.
# KAPSAM: Yalnızca tek kanal tanılama testi; gerçek cihaz testi yapılmış sayılmaz.

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: adc
    pin: GPIO33
    name: "GRV005 1T Raw ADC Test"
    id: grv005_1t_raw_adc_test
    attenuation: 12db
    raw: true
    update_interval: 1s
    accuracy_decimals: 0
    on_value:
      then:
        - lambda: |-
            ESP_LOGI(
              "grv005_raw",
              "GPIO33 raw ADC value = %.0f",
              x
            );
