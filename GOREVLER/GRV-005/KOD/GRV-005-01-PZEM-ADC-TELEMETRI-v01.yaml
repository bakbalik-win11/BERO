# GRV-005-01 — v01 DRAFT
# New experimental file. Do not replace GRV-002/GRV-004 or ALT09/ALT10.
# Not yet compiled or tested on hardware.
esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Existing recorded PZEM UART assignment; verify physical TX/RX before powering.
uart:
  id: pzem_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  stop_bits: 1

modbus:
  uart_id: pzem_uart

# First draft deliberately isolates PZEM timestamp behavior.
# ADC 1000-sample statistics and final CSV serialization are the next iteration,
# after this PZEM communication/timing path is reviewed and verified.
globals:
  - id: pzem_update_millis
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: pzem_update_seen
    type: bool
    restore_value: no
    initial_value: 'false'

time:
  - platform: sntp
    id: bero_clock
    timezone: Europe/Istanbul

sensor:
  - platform: pzemac
    voltage:
      name: "PZEM Gerilim"
    current:
      id: pzem_current
      name: "PZEM Akim"
      on_value:
        then:
          - lambda: |-
              id(pzem_update_millis) = millis();
              id(pzem_update_seen) = true;
    power:
      name: "PZEM Guc"
    energy:
      name: "PZEM Enerji"
    frequency:
      name: "PZEM Frekans"
    power_factor:
      name: "PZEM Guc Faktoru"
    update_interval: 5s

text_sensor:
  - platform: template
    name: "GRV005 PZEM Timestamp Durumu"
    update_interval: 1s
    lambda: |-
      if (!id(pzem_update_seen)) {
        return {"PZEM_UPDATE_NOT_SEEN"};
      }
      char buffer[80];
      auto now = id(bero_clock).now();
      if (now.is_valid()) {
        snprintf(buffer, sizeof(buffer),
                 "epoch_s=%lld,pzem_update_millis=%u,age_ms=%u",
                 (long long) now.timestamp,
                 (unsigned int) id(pzem_update_millis),
                 (unsigned int) (millis() - id(pzem_update_millis)));
      } else {
        snprintf(buffer, sizeof(buffer),
                 "CLOCK_NOT_SYNCED,pzem_update_millis=%u,age_ms=%u",
                 (unsigned int) id(pzem_update_millis),
                 (unsigned int) (millis() - id(pzem_update_millis)));
      }
      return {buffer};
