# ============================================================
# PROJE BERO
# GRV-005-14 v04 — CALISAN KOD / GERCEK CIHAZ LOGU ALINDI
# ============================================================
#
# Hedef:
# - CH0-1T GPIO33
# - CH1-2T GPIO34
# - CH2-3T GPIO35
# - BIAS   GPIO32
# - PZEM TX GPIO16 / RX GPIO17, 9600 baud
#
# Bu aday:
# - Her kanaldan 1000 örnek toplar.
# - CSV başlığını ve dört kanal satırını ESPHome loguna yazar.
# - Hesaplanmayan alanları boş bırakır.
# - pzem_update_millis gerçek Modbus yanıt zamanı değildir.
# - Otomatik tekrar ve CSV dosyasına yazma yoktur.
#
# DURUM:
# Gerçek cihaz logu 2026-10-11 14:44:55 +0300 tarihinde alındı.
# ESPHome 2026.9.1; firmware compile time 2026-10-11 14:40:42 +0300.
# Dört ADC kanalı 1000 örnek verdi; başlık iki parçalı çıktı.
# 92 ms interval uyarısı sürüyor; ölçüm kalitesi ve zamanlama ayrıca değerlendirilir.
# ============================================================

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: grv514_pzem_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  parity: NONE
  stop_bits: 1

globals:
  - id: grv514_pc
    type: float
    initial_value: '0.0'
  - id: grv514_pp
    type: float
    initial_value: '0.0'
  - id: grv514_pf
    type: float
    initial_value: '0.0'
  - id: grv514_pzem_ms
    type: uint32_t
    initial_value: '0'
  - id: grv514_pc_ok
    type: bool
    initial_value: 'false'
  - id: grv514_pp_ok
    type: bool
    initial_value: 'false'
  - id: grv514_pf_ok
    type: bool
    initial_value: 'false'
  - id: grv514_n0
    type: uint32_t
    initial_value: '0'
  - id: grv514_n1
    type: uint32_t
    initial_value: '0'
  - id: grv514_n2
    type: uint32_t
    initial_value: '0'
  - id: grv514_nb
    type: uint32_t
    initial_value: '0'
  - id: grv514_z0
    type: uint32_t
    initial_value: '0'
  - id: grv514_z1
    type: uint32_t
    initial_value: '0'
  - id: grv514_z2
    type: uint32_t
    initial_value: '0'
  - id: grv514_zb
    type: uint32_t
    initial_value: '0'
  - id: grv514_s0
    type: double
    initial_value: '0.0'
  - id: grv514_q0
    type: double
    initial_value: '0.0'
  - id: grv514_s1
    type: double
    initial_value: '0.0'
  - id: grv514_q1
    type: double
    initial_value: '0.0'
  - id: grv514_s2
    type: double
    initial_value: '0.0'
  - id: grv514_q2
    type: double
    initial_value: '0.0'
  - id: grv514_sb
    type: double
    initial_value: '0.0'
  - id: grv514_m0
    type: double
    initial_value: '0.0'
  - id: grv514_m20
    type: double
    initial_value: '0.0'
  - id: grv514_m1
    type: double
    initial_value: '0.0'
  - id: grv514_m21
    type: double
    initial_value: '0.0'
  - id: grv514_m2
    type: double
    initial_value: '0.0'
  - id: grv514_m22
    type: double
    initial_value: '0.0'
  - id: grv514_mb
    type: double
    initial_value: '0.0'
  - id: grv514_m2b
    type: double
    initial_value: '0.0'
  - id: grv514_min0
    type: float
    initial_value: '1.0e9'
  - id: grv514_max0
    type: float
    initial_value: '-1.0'
  - id: grv514_min1
    type: float
    initial_value: '1.0e9'
  - id: grv514_max1
    type: float
    initial_value: '-1.0'
  - id: grv514_min2
    type: float
    initial_value: '1.0e9'
  - id: grv514_max2
    type: float
    initial_value: '-1.0'
  - id: grv514_minb
    type: float
    initial_value: '1.0e9'
  - id: grv514_maxb
    type: float
    initial_value: '-1.0'
  - id: grv514_started
    type: bool
    initial_value: 'false'
  - id: grv514_reported
    type: bool
    initial_value: 'false'
  - id: grv514_start_ms
    type: uint32_t
    initial_value: '0'

sensor:
  - platform: pzemac
    update_interval: 1s
    current:
      name: "GRV005 PZEM Current"
      id: grv514_pzem_current
      on_value:
        then:
          - lambda: |-
              if (std::isfinite(x)) {
                id(grv514_pc) = x;
                id(grv514_pc_ok) = true;
                id(grv514_pzem_ms) = millis();
              }
    power:
      name: "GRV005 PZEM Power"
      id: grv514_pzem_power
      on_value:
        then:
          - lambda: |-
              if (std::isfinite(x)) {
                id(grv514_pp) = x;
                id(grv514_pp_ok) = true;
              }
    power_factor:
      name: "GRV005 PZEM PF"
      id: grv514_pzem_pf
      on_value:
        then:
          - lambda: |-
              if (std::isfinite(x)) {
                id(grv514_pf) = x;
                id(grv514_pf_ok) = true;
              }

  - platform: adc
    pin: GPIO33
    id: grv514_adc0
    internal: true
    attenuation: 12db
    raw: true
    update_interval: 10ms
    on_value:
      then:
        - lambda: |-
            if (!std::isfinite(x) || x < 0.0f ||
                id(grv514_n0) >= 1000) return;
            if (!id(grv514_started)) {
              id(grv514_start_ms) = millis();
              id(grv514_started) = true;
            }
            const double v = x;
            id(grv514_n0)++;
            if (v == 0.0) id(grv514_z0)++;
            id(grv514_s0) += v;
            id(grv514_q0) += v * v;
            const double d = v - id(grv514_m0);
            id(grv514_m0) += d / id(grv514_n0);
            id(grv514_m20) += d * (v - id(grv514_m0));
            if (v < id(grv514_min0)) id(grv514_min0) = v;
            if (v > id(grv514_max0)) id(grv514_max0) = v;

  - platform: adc
    pin: GPIO34
    id: grv514_adc1
    internal: true
    attenuation: 12db
    raw: true
    update_interval: 10ms
    on_value:
      then:
        - lambda: |-
            if (!std::isfinite(x) || x < 0.0f ||
                id(grv514_n1) >= 1000) return;
            if (!id(grv514_started)) {
              id(grv514_start_ms) = millis();
              id(grv514_started) = true;
            }
            const double v = x;
            id(grv514_n1)++;
            if (v == 0.0) id(grv514_z1)++;
            id(grv514_s1) += v;
            id(grv514_q1) += v * v;
            const double d = v - id(grv514_m1);
            id(grv514_m1) += d / id(grv514_n1);
            id(grv514_m21) += d * (v - id(grv514_m1));
            if (v < id(grv514_min1)) id(grv514_min1) = v;
            if (v > id(grv514_max1)) id(grv514_max1) = v;

  - platform: adc
    pin: GPIO35
    id: grv514_adc2
    internal: true
    attenuation: 12db
    raw: true
    update_interval: 10ms
    on_value:
      then:
        - lambda: |-
            if (!std::isfinite(x) || x < 0.0f ||
                id(grv514_n2) >= 1000) return;
            if (!id(grv514_started)) {
              id(grv514_start_ms) = millis();
              id(grv514_started) = true;
            }
            const double v = x;
            id(grv514_n2)++;
            if (v == 0.0) id(grv514_z2)++;
            id(grv514_s2) += v;
            id(grv514_q2) += v * v;
            const double d = v - id(grv514_m2);
            id(grv514_m2) += d / id(grv514_n2);
            id(grv514_m22) += d * (v - id(grv514_m2));
            if (v < id(grv514_min2)) id(grv514_min2) = v;
            if (v > id(grv514_max2)) id(grv514_max2) = v;

  - platform: adc
    pin: GPIO32
    id: grv514_bias
    internal: true
    attenuation: 12db
    raw: true
    update_interval: 10ms
    on_value:
      then:
        - lambda: |-
            if (!std::isfinite(x) || x < 0.0f ||
                id(grv514_nb) >= 1000) return;
            if (!id(grv514_started)) {
              id(grv514_start_ms) = millis();
              id(grv514_started) = true;
            }
            const double v = x;
            id(grv514_nb)++;
            if (v == 0.0) id(grv514_zb)++;
            id(grv514_sb) += v;
            const double d = v - id(grv514_mb);
            id(grv514_mb) += d / id(grv514_nb);
            id(grv514_m2b) += d * (v - id(grv514_mb));
            if (v < id(grv514_minb)) id(grv514_minb) = v;
            if (v > id(grv514_maxb)) id(grv514_maxb) = v;

# Raporlama ADC on_value callback'inden ayrıldı.
# Böylece uzun CSV logları örnek toplama callback'inde çalıştırılmaz.
interval:
  - interval: 50ms
    then:
      - if:
          condition:
            lambda: |-
              return !id(grv514_reported) &&
                     id(grv514_n0) >= 1000 &&
                     id(grv514_n1) >= 1000 &&
                     id(grv514_n2) >= 1000 &&
                     id(grv514_nb) >= 1000;
          then:
            - script.execute: grv514_report

script:
  - id: grv514_report
    mode: single
    then:
      - lambda: |-
          if (id(grv514_reported)) return;
          if (id(grv514_n0) < 1000 ||
              id(grv514_n1) < 1000 ||
              id(grv514_n2) < 1000 ||
              id(grv514_nb) < 1000) return;
          id(grv514_reported) = true;
          const uint32_t end_ms = millis();
          const uint32_t duration_ms =
            static_cast<uint32_t>(end_ms - id(grv514_start_ms));
          const uint32_t center_ms =
            static_cast<uint32_t>(id(grv514_start_ms) + duration_ms / 2U);
          const int32_t delta_ms =
            static_cast<int32_t>(id(grv514_pzem_ms) - center_ms);
          const double n0 = id(grv514_n0);
          const double n1 = id(grv514_n1);
          const double n2 = id(grv514_n2);
          const double nb = id(grv514_nb);
          const double mean0 = id(grv514_s0) / n0;
          const double mean1 = id(grv514_s1) / n1;
          const double mean2 = id(grv514_s2) / n2;
          const double bias_mean = id(grv514_sb) / nb;
          const double std0 = std::sqrt(id(grv514_m20) / (n0 - 1.0));
          const double std1 = std::sqrt(id(grv514_m21) / (n1 - 1.0));
          const double std2 = std::sqrt(id(grv514_m22) / (n2 - 1.0));
          const double bias_std = std::sqrt(id(grv514_m2b) / (nb - 1.0));
          const double raw0 = std::sqrt(id(grv514_q0) / n0);
          const double raw1 = std::sqrt(id(grv514_q1) / n1);
          const double raw2 = std::sqrt(id(grv514_q2) / n2);
          const double ac0 =
            id(grv514_q0) / n0 - 2.0 * bias_mean * mean0
            + bias_mean * bias_mean;
          const double ac1 =
            id(grv514_q1) / n1 - 2.0 * bias_mean * mean1
            + bias_mean * bias_mean;
          const double ac2 =
            id(grv514_q2) / n2 - 2.0 * bias_mean * mean2
            + bias_mean * bias_mean;
          const double rms0 = std::sqrt(ac0 > 0.0 ? ac0 : 0.0);
          const double rms1 = std::sqrt(ac1 > 0.0 ? ac1 : 0.0);
          const double rms2 = std::sqrt(ac2 > 0.0 ? ac2 : 0.0);
          ESP_LOGI("grv514_csv", "CSV_HEADER_PART_1|measurement_id,experiment_id,firmware_version,device_name,channel_id,load_label,notes,window_start_millis,window_end_millis,window_center_millis,window_duration_ms,pzem_update_millis,time_delta_ms,window_center_epoch_s,pzem_timestamp,sample_count");
          ESP_LOGI("grv514_csv", "CSV_HEADER_PART_2|invalid_count,zero_count,adc_mean,adc_std,adc_min,adc_max,adc_range,adc_median,adc_p05,adc_p25,adc_p75,adc_p95,adc_p95_minus_p05,adc_rms_raw,adc_rms_ac,bias_mean,bias_std,bias_min,bias_max,pzem_voltage,pzem_current,pzem_power,pzem_pf,pzem_frequency,pzem_energy");
          if (id(grv514_pc_ok) && id(grv514_pp_ok) &&
              id(grv514_pf_ok)) {
            ESP_LOGI("grv514_csv",
              "esp32d1_%u_001,,,esp32d1,CH0-1T,,,%u,%u,%u,%u,%u,%ld,,,1000,NOT_TRACKED,%u,%.6f,%.6f,%.0f,%.0f,%.0f,,,,,,,%.6f,%.6f,%.6f,%.6f,%.0f,%.0f,,%.3f,%.3f,%.4f,,",
              (unsigned)id(grv514_start_ms),
              (unsigned)id(grv514_start_ms),
              (unsigned)end_ms,
              (unsigned)center_ms,
              (unsigned)duration_ms,
              (unsigned)id(grv514_pzem_ms),
              (long)delta_ms,
              (unsigned)id(grv514_z0),
              mean0, std0,
              id(grv514_min0), id(grv514_max0),
              id(grv514_max0) - id(grv514_min0),
              raw0, rms0, bias_mean, bias_std,
              id(grv514_minb), id(grv514_maxb),
              id(grv514_pc), id(grv514_pp), id(grv514_pf)
            );
            ESP_LOGI("grv514_csv",
              "esp32d1_%u_001,,,esp32d1,CH1-2T,,,%u,%u,%u,%u,%u,%ld,,,1000,NOT_TRACKED,%u,%.6f,%.6f,%.0f,%.0f,%.0f,,,,,,,%.6f,%.6f,%.6f,%.6f,%.0f,%.0f,,%.3f,%.3f,%.4f,,",
              (unsigned)id(grv514_start_ms),
              (unsigned)id(grv514_start_ms),
              (unsigned)end_ms,
              (unsigned)center_ms,
              (unsigned)duration_ms,
              (unsigned)id(grv514_pzem_ms),
              (long)delta_ms,
              (unsigned)id(grv514_z1),
              mean1, std1,
              id(grv514_min1), id(grv514_max1),
              id(grv514_max1) - id(grv514_min1),
              raw1, rms1, bias_mean, bias_std,
              id(grv514_minb), id(grv514_maxb),
              id(grv514_pc), id(grv514_pp), id(grv514_pf)
            );
            ESP_LOGI("grv514_csv",
              "esp32d1_%u_001,,,esp32d1,CH2-3T,,,%u,%u,%u,%u,%u,%ld,,,1000,NOT_TRACKED,%u,%.6f,%.6f,%.0f,%.0f,%.0f,,,,,,,%.6f,%.6f,%.6f,%.6f,%.0f,%.0f,,%.3f,%.3f,%.4f,,",
              (unsigned)id(grv514_start_ms),
              (unsigned)id(grv514_start_ms),
              (unsigned)end_ms,
              (unsigned)center_ms,
              (unsigned)duration_ms,
              (unsigned)id(grv514_pzem_ms),
              (long)delta_ms,
              (unsigned)id(grv514_z2),
              mean2, std2,
              id(grv514_min2), id(grv514_max2),
              id(grv514_max2) - id(grv514_min2),
              raw2, rms2, bias_mean, bias_std,
              id(grv514_minb), id(grv514_maxb),
              id(grv514_pc), id(grv514_pp), id(grv514_pf)
            );
            ESP_LOGI("grv514_csv",
              "esp32d1_%u_001,,,esp32d1,BIAS,,,%u,%u,%u,%u,%u,%ld,,,1000,NOT_TRACKED,%u,%.6f,%.6f,%.0f,%.0f,%.0f,,,,,,,,,%.6f,%.6f,%.0f,%.0f,,%.3f,%.3f,%.4f,,",
              (unsigned)id(grv514_start_ms),
              (unsigned)id(grv514_start_ms),
              (unsigned)end_ms,
              (unsigned)center_ms,
              (unsigned)duration_ms,
              (unsigned)id(grv514_pzem_ms),
              (long)delta_ms,
              (unsigned)id(grv514_zb),
              bias_mean, bias_std,
              id(grv514_minb), id(grv514_maxb),
              id(grv514_maxb) - id(grv514_minb),
              bias_mean, bias_std,
              id(grv514_minb), id(grv514_maxb),
              id(grv514_pc), id(grv514_pp), id(grv514_pf)
            );
          } else {
            ESP_LOGW("grv514_csv",
              "CSV rows not emitted: PZEM valid flags current=%d power=%d pf=%d",
              id(grv514_pc_ok), id(grv514_pp_ok), id(grv514_pf_ok));
          }
