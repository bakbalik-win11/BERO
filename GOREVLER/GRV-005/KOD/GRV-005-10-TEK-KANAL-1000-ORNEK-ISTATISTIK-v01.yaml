# PROJE BERO — GRV-005-10
# HEDEF: GPIO33 / 1T üzerinden 1000 ham ADC örneği toplayıp tek satır istatistik üretmek.
# DONANIM: ESP32-D1, GPIO33 / 1T
# NOT: Bu sürüm yalnızca kod taslağıdır; derleme ve cihaz sonucu ayrıca kaydedilecek.
# NOT: invalid_count, ESPHome sensör callback'i ile gerçek ADC sürücü hatası olarak ölçülemez.
# NOT: BIAS kanalı bu tek-kanal testinde örneklenmediği için adc_rms_ac üretilmez.

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: adc
    pin: GPIO33
    name: "GRV005 1T Raw ADC Test"
    id: grv005_1t_raw_adc_test
    internal: true
    attenuation: 12db
    raw: true
    unit_of_measurement: "ADC count"
    accuracy_decimals: 0
    update_interval: 10ms
    on_value:
      then:
        - lambda: |-
            // A callback with a finite non-negative value is one acquired sample.
            // This does not expose low-level ADC driver errors or missed conversions.
            if (!std::isfinite(x) || x < 0.0f) {
              return;
            }

            constexpr uint32_t WINDOW_TARGET = 1000;
            static uint32_t sample_count = 0;
            static uint32_t zero_count = 0;
            static double sum = 0.0;
            static double sum_sq = 0.0;
            static double running_mean = 0.0;
            static double m2 = 0.0;

            const double value = static_cast<double>(x);
            sample_count++;

            if (value == 0.0) {
              zero_count++;
            }

            sum += value;
            sum_sq += value * value;

            // Welford online accumulator; sample variance uses N - 1.
            const double delta = value - running_mean;
            running_mean += delta / static_cast<double>(sample_count);
            const double delta2 = value - running_mean;
            m2 += delta * delta2;

            if (sample_count >= WINDOW_TARGET) {
              const double adc_mean = sum / static_cast<double>(sample_count);
              const double adc_rms_raw = std::sqrt(sum_sq / static_cast<double>(sample_count));
              const double adc_std = sample_count > 1
                ? std::sqrt(m2 / static_cast<double>(sample_count - 1))
                : 0.0;

              // BIAS was not sampled in this single-channel test.
              // Keep bias-centred AC RMS unavailable rather than substituting
              // mean-centred RMS and silently changing the agreed definition.
              ESP_LOGI(
                "grv005_window",
                "channel=CH0-1T sample_count=%u invalid_count=NOT_TRACKED zero_count=%u adc_mean=%.6f adc_std=%.6f adc_rms_raw=%.6f adc_rms_ac=NA_NO_BIAS",
                static_cast<unsigned>(sample_count),
                static_cast<unsigned>(zero_count),
                adc_mean,
                adc_std,
                adc_rms_raw
              );

              // Start the next independent 1000-callback window.
              sample_count = 0;
              zero_count = 0;
              sum = 0.0;
              sum_sq = 0.0;
              running_mean = 0.0;
              m2 = 0.0;
            }
