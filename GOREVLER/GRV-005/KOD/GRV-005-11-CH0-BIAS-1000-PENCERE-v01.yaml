# PROJE BERO — GRV-005-11 v01
# HEDEF: GPIO33 (CH0-1T) ve GPIO32 (BIAS) kanallarından ayrı ayrı 1000 ham ADC callback örneği toplamak.
# SONUC: adc_rms_ac = sqrt(mean((CH0 - bias_mean)^2)); bias_mean ayrı raporlanır.
# DONANIM: ESP32-D1, GPIO33 / 1T, GPIO32 / BIAS
# NOT: Derleme ve cihaz testi bu sürüm için henüz doğrulanmadı.
# NOT: İki ADC sensörünün callback'leri donanımda eşzamanlı örnekleme garantisi vermez.
# NOT: invalid_count sürücü hata sayısı değildir; ölçülemediği için NOT_TRACKED olarak yazılır.

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: grv511_ch0_count
    type: uint32_t
    initial_value: '0'
  - id: grv511_bias_count
    type: uint32_t
    initial_value: '0'
  - id: grv511_ch0_zero_count
    type: uint32_t
    initial_value: '0'
  - id: grv511_bias_zero_count
    type: uint32_t
    initial_value: '0'
  - id: grv511_ch0_sum
    type: double
    initial_value: '0.0'
  - id: grv511_ch0_sum_sq
    type: double
    initial_value: '0.0'
  - id: grv511_ch0_mean
    type: double
    initial_value: '0.0'
  - id: grv511_ch0_m2
    type: double
    initial_value: '0.0'
  - id: grv511_bias_sum
    type: double
    initial_value: '0.0'
  - id: grv511_window_start_ms
    type: uint32_t
    initial_value: '0'
  - id: grv511_window_started
    type: bool
    initial_value: 'false'
  - id: grv511_reported
    type: bool
    initial_value: 'false'

sensor:
  - platform: adc
    pin: GPIO33
    name: "GRV005 1T Raw ADC Test"
    id: grv511_ch0_adc
    internal: true
    attenuation: 12db
    raw: true
    unit_of_measurement: "ADC count"
    accuracy_decimals: 0
    update_interval: 10ms
    on_value:
      then:
        - lambda: |-
            if (!std::isfinite(x) || x < 0.0f || id(grv511_ch0_count) >= 1000) {
              return;
            }

            if (!id(grv511_window_started)) {
              id(grv511_window_start_ms) = millis();
              id(grv511_window_started) = true;
            }

            const double value = static_cast<double>(x);
            id(grv511_ch0_count)++;

            if (value == 0.0) {
              id(grv511_ch0_zero_count)++;
            }

            id(grv511_ch0_sum) += value;
            id(grv511_ch0_sum_sq) += value * value;

            // Welford online accumulator for sample standard deviation (N - 1).
            const double delta = value - id(grv511_ch0_mean);
            id(grv511_ch0_mean) += delta / static_cast<double>(id(grv511_ch0_count));
            const double delta2 = value - id(grv511_ch0_mean);
            id(grv511_ch0_m2) += delta * delta2;

            if (id(grv511_ch0_count) >= 1000 &&
                id(grv511_bias_count) >= 1000 &&
                !id(grv511_reported)) {
              id(grv511_reported) = true;

              const uint32_t duration_ms =
                static_cast<uint32_t>(millis() - id(grv511_window_start_ms));
              const double ch0_mean =
                id(grv511_ch0_sum) / static_cast<double>(id(grv511_ch0_count));
              const double bias_mean =
                id(grv511_bias_sum) / static_cast<double>(id(grv511_bias_count));
              const double ch0_rms_raw =
                std::sqrt(id(grv511_ch0_sum_sq) / static_cast<double>(id(grv511_ch0_count)));
              const double ch0_std = id(grv511_ch0_count) > 1
                ? std::sqrt(id(grv511_ch0_m2) / static_cast<double>(id(grv511_ch0_count) - 1))
                : 0.0;

              // RMS of CH0 values centred on the separately measured BIAS mean.
              const double ac_mean_square =
                (id(grv511_ch0_sum_sq) / static_cast<double>(id(grv511_ch0_count)))
                - (2.0 * bias_mean * ch0_mean)
                + (bias_mean * bias_mean);
              const double ch0_rms_ac = std::sqrt(ac_mean_square > 0.0 ? ac_mean_square : 0.0);

              ESP_LOGI(
                "grv005_window",
                "channel=CH0-1T bias_channel=BIAS sample_count=%u bias_sample_count=%u window_duration_ms=%u invalid_count=NOT_TRACKED zero_count=%u bias_zero_count=%u adc_mean=%.6f adc_std=%.6f adc_rms_raw=%.6f bias_mean=%.6f adc_rms_ac=%.6f",
                static_cast<unsigned>(id(grv511_ch0_count)),
                static_cast<unsigned>(id(grv511_bias_count)),
                static_cast<unsigned>(duration_ms),
                static_cast<unsigned>(id(grv511_ch0_zero_count)),
                static_cast<unsigned>(id(grv511_bias_zero_count)),
                ch0_mean,
                ch0_std,
                ch0_rms_raw,
                bias_mean,
                ch0_rms_ac
              );
            }

  - platform: adc
    pin: GPIO32
    name: "GRV005 BIAS Raw ADC Test"
    id: grv511_bias_adc
    internal: true
    attenuation: 12db
    raw: true
    unit_of_measurement: "ADC count"
    accuracy_decimals: 0
    update_interval: 10ms
    on_value:
      then:
        - lambda: |-
            if (!std::isfinite(x) || x < 0.0f || id(grv511_bias_count) >= 1000) {
              return;
            }

            if (!id(grv511_window_started)) {
              id(grv511_window_start_ms) = millis();
              id(grv511_window_started) = true;
            }

            const double value = static_cast<double>(x);
            id(grv511_bias_count)++;

            if (value == 0.0) {
              id(grv511_bias_zero_count)++;
            }

            id(grv511_bias_sum) += value;

            if (id(grv511_ch0_count) >= 1000 &&
                id(grv511_bias_count) >= 1000 &&
                !id(grv511_reported)) {
              id(grv511_reported) = true;

              const uint32_t duration_ms =
                static_cast<uint32_t>(millis() - id(grv511_window_start_ms));
              const double ch0_mean =
                id(grv511_ch0_sum) / static_cast<double>(id(grv511_ch0_count));
              const double bias_mean =
                id(grv511_bias_sum) / static_cast<double>(id(grv511_bias_count));
              const double ch0_rms_raw =
                std::sqrt(id(grv511_ch0_sum_sq) / static_cast<double>(id(grv511_ch0_count)));
              const double ch0_std = id(grv511_ch0_count) > 1
                ? std::sqrt(id(grv511_ch0_m2) / static_cast<double>(id(grv511_ch0_count) - 1))
                : 0.0;
              const double ac_mean_square =
                (id(grv511_ch0_sum_sq) / static_cast<double>(id(grv511_ch0_count)))
                - (2.0 * bias_mean * ch0_mean)
                + (bias_mean * bias_mean);
              const double ch0_rms_ac = std::sqrt(ac_mean_square > 0.0 ? ac_mean_square : 0.0);

              ESP_LOGI(
                "grv005_window",
                "channel=CH0-1T bias_channel=BIAS sample_count=%u bias_sample_count=%u window_duration_ms=%u invalid_count=NOT_TRACKED zero_count=%u bias_zero_count=%u adc_mean=%.6f adc_std=%.6f adc_rms_raw=%.6f bias_mean=%.6f adc_rms_ac=%.6f",
                static_cast<unsigned>(id(grv511_ch0_count)),
                static_cast<unsigned>(id(grv511_bias_count)),
                static_cast<unsigned>(duration_ms),
                static_cast<unsigned>(id(grv511_ch0_zero_count)),
                static_cast<unsigned>(id(grv511_bias_zero_count)),
                ch0_mean,
                ch0_std,
                ch0_rms_raw,
                bias_mean,
                ch0_rms_ac
              );
            }
