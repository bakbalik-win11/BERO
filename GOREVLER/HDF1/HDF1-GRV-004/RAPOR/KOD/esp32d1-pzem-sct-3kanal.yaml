esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: pzem_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  stop_bits: 1

modbus:
  uart_id: pzem_uart

sensor:
  - platform: pzemac
    voltage:
      name: "PZEM Gerilim"
    current:
      name: "PZEM Akım"
    power:
      name: "PZEM Güç"
    energy:
      name: "PZEM Enerji"
    frequency:
      name: "PZEM Frekans"
    power_factor:
      name: "PZEM Güç Faktörü"
    update_interval: 5s

  - platform: adc
    pin: GPIO32
    name: "BERO CH1 Ham Voltaj"
    id: bero_ch1_voltage
    attenuation: 12db
    update_interval: 1s
    accuracy_decimals: 3

  - platform: adc
    pin: GPIO33
    name: "BERO CH2 Ham Voltaj"
    id: bero_ch2_voltage
    attenuation: 12db
    update_interval: 1s
    accuracy_decimals: 3

  - platform: adc
    pin: GPIO34
    name: "BERO CH3 Ham Voltaj"
    id: bero_ch3_voltage
    attenuation: 12db
    update_interval: 1s
    accuracy_decimals: 3
