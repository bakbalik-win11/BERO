# PROJE BERO — GRV-005-10 v02
# HEDEF: GPIO33 / 1T üzerinden 1000 ham ADC örneği toplayıp tek satır istatistik üretmek.
# EK: Pencere süresini millis() farkıyla ölç ve logla.
# DONANIM: ESP32-D1, GPIO33 / 1T
# NOT: Derleme ve cihaz testi bu dosya için henüz doğrulanmadı.
# NOT: invalid_count sürücü seviyesindeki gerçek ADC hata sayısı değildir; ölçülemediği için NOT_TRACKED yazılır.
# NOT: BIAS örneklenmediği için adc_rms_ac üretilmez.

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: adc
    pin: GPIO33
    name: "GRV005 1T Raw ADC Test"
    id: grv005_1t_raw_adc_test
    internal: true
    attenuation: 12db
    raw: true
    unit_of_measurement: "ADC count"
    accuracy_decimals: 0
    update_interval: 10ms
    on_value:
      then:
        - lambda: |-
            if (!std::isfinite(x) || x < 0.0f) {
              return;
            }

            constexpr uint32_t WINDOW_TARGET = 1000;
            static uint32_t sample_count = 0;
            static uint32_t zero_count = 0;
            static uint32_t window_start_ms = millis();
            static double sum = 0.0;
            static double sum_sq = 0.0;
            static double running_mean = 0.0;
            static double m2 = 0.0;

            const double value = static_cast<double>(x);
            sample_count++;

            if (value == 0.0) {
              zero_count++;
            }

            sum += value;
            sum_sq += value * value;

            // Welford online accumulator; sample variance uses N - 1.
            const double delta = value - running_mean;
            running_mean += delta / static_cast<double>(sample_count);
            const double delta2 = value - running_mean;
            m2 += delta * delta2;

            if (sample_count >= WINDOW_TARGET) {
              const uint32_t window_duration_ms =
                static_cast<uint32_t>(millis() - window_start_ms);

              const double adc_mean = sum / static_cast<double>(sample_count);
              const double adc_rms_raw =
                std::sqrt(sum_sq / static_cast<double>(sample_count));
              const double adc_std = sample_count > 1
                ? std::sqrt(m2 / static_cast<double>(sample_count - 1))
                : 0.0;

              ESP_LOGI(
                "grv005_window",
                "channel=CH0-1T sample_count=%u window_duration_ms=%u invalid_count=NOT_TRACKED zero_count=%u adc_mean=%.6f adc_std=%.6f adc_rms_raw=%.6f adc_rms_ac=NA_NO_BIAS",
                static_cast<unsigned>(sample_count),
                static_cast<unsigned>(window_duration_ms),
                static_cast<unsigned>(zero_count),
                adc_mean,
                adc_std,
                adc_rms_raw
              );

              // Reset for the next independent window.
              sample_count = 0;
              zero_count = 0;
              sum = 0.0;
              sum_sq = 0.0;
              running_mean = 0.0;
              m2 = 0.0;
              window_start_ms = millis();
            }
