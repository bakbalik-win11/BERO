# BERO doğrulanmış yapılandırma — ESP32D1 + PZEM-004T V3.0
# Kaynak: kullanıcı tarafından sağlanan YAML ve ESPHome logu.
# Durum: yapılandırma yüklenmiş; logda PZEM yanıtı alınamadığı görülüyor.
# Bu kayıt internetten bulunan örneklerden ayrı, BERO deney kaydıdır.

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: pzem_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  stop_bits: 1

modbus:
  uart_id: pzem_uart

sensor:
  - platform: pzemac
    voltage:
      name: "PZEM Gerilim"
    current:
      name: "PZEM Akım"
    power:
      name: "PZEM Güç"
    energy:
      name: "PZEM Enerji"
    frequency:
      name: "PZEM Frekans"
    power_factor:
      name: "PZEM Güç Faktörü"
    update_interval: 5s
