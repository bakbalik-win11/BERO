# ============================================================
# BERO MODUL 2 — ESP32D1
# DORT ADC GIRISI / UZUN SURELI GERILIM GOZLEM KODU
# SURUM: 1 SANIYE ARALIKLI ADC LOG
# DURUM: ESKI DORTLU ADC LOG SURUMU GERI YUKLENDI;
#        YENI DERLEME VE MODUL TESTI BEKLIYOR
# ============================================================
#
# AMAC:
# - Uc SCT sinyal girisini ve ortak bias hattini ayni anda izlemek.
# - SCT-1 bagliyken GPIO32 davranisini uzun sureli kaydetmek.
# - GPIO33, GPIO34 ve GPIO35 degerlerini ayni zaman akisinda
#   tani amaciyla loglamak.
# - Uzun sureli kayitta ADC gerilimlerinin degisimini gozlemlemek.
#
# BAGLANTILAR (KULLANICI BILDIRIMI):
# - SCT-1 / sari sinyal       -> GPIO32 (ADC1_CH4)
# - SCT-2 / yesil sinyal      -> GPIO33 (ADC1_CH5)
# - SCT-3 / mavi sinyal       -> GPIO34 (ADC1_CH6)
# - Ortak bias / turuncu      -> GPIO35 (ADC1_CH7)
#
# TEST DUZENI:
# - Bu testte SCT-1 fiziksel olarak bagli olacak.
# - SCT-2 ve SCT-3 bagli degilse GPIO33/GPIO34 okumasi bosta
#   kalan ADC girisi olarak degerlendirilecek; sensor verisi sayilmaz.
# - GPIO35 ortak bias gerilimini izler.
#
# BEKLENEN:
# - Home Assistant'ta dort ADC gerilim sensoru gorunur.
# - Her sensor 1 saniyede bir ADC gerilimi yayinlar.
# - Her ornek ESPHome loguna kanal adi, GPIO ve voltaj ile yazilir.
# - GPIO35 ortak bias degeri de her saniye logda gorunur.
#
# ONEMLI SINIR:
# - Bu kod anlik ADC gerilimi okur; RMS veya akim hesaplamaz.
# - 1 saniyelik ADC yayini 50 Hz dalga seklini yakalamaz.
# - Bu uzun kayit, gerilim/bias davranisini ve yuk degisimi
#   sirasindaki yavas gozlemi incelemek icindir.
# - ct_clamp, akim katsayisi veya kalibrasyon filtresi yoktur.
#
# GUVENLIK:
# - ADC pinlerine 5 V uygulanmaz.
# - Analog dugum gerilimleri ESP32 ADC giris sinirlari icinde
#   olmalidir.
# - SCT yalniz tek yalıtılmış iletkeni kavrar; faz ve notr birlikte
#   SCT icinden gecirilmez.
# - SCT/kanal baglantisi yuk enerjisizken degistirilir.
# - Harici 5 V ve PC USB ayni anda, kartin guc yolu dogrulanmadan
#   baglanmaz.
# ============================================================

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  # SCT-1: sari kablo / GPIO32. Anlik ADC voltaji.
  - platform: adc
    pin: GPIO32
    name: "ESP32D1 SCT 1 ADC Voltage"
    id: sct_1_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "SCT-1 GPIO32 ADC = %.3f V", x);

  # SCT-2: yesil kablo / GPIO33. Anlik ADC voltaji.
  - platform: adc
    pin: GPIO33
    name: "ESP32D1 SCT 2 ADC Voltage"
    id: sct_2_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "SCT-2 GPIO33 ADC = %.3f V", x);

  # SCT-3: mavi kablo / GPIO34. Anlik ADC voltaji.
  - platform: adc
    pin: GPIO34
    name: "ESP32D1 SCT 3 ADC Voltage"
    id: sct_3_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "SCT-3 GPIO34 ADC = %.3f V", x);

  # Ortak bias: turuncu kablo / GPIO35. Her saniye loga yazilir.
  - platform: adc
    pin: GPIO35
    name: "ESP32D1 Common Bias ADC Voltage"
    id: common_bias_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "COMMON BIAS GPIO35 ADC = %.3f V", x);
