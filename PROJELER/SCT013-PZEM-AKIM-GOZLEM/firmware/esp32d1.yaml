# ============================================================
# BERO MODUL 2 — ESP32D1
# TEK SCT AKIM OKUMASI + ORTAK BIAS IZLEME
# SURUM: TEK KANAL ct_clamp (SCT-3 / GPIO34)
# DURUM: YAPILANDIRILDI; YENI DERLEME VE TEK KANAL TESTI BEKLIYOR
# ============================================================
#
# AMAC:
# - Tek seferde yalniz bir SCT kanalini okumak.
# - Mevcut test duzeninde SCT-3 sinyalini GPIO34 / ADC1_CH6
#   uzerinden ESPHome ct_clamp ile 200 ms pencerede olcmek.
# - Ortak bias seviyesini GPIO35 / ADC1_CH7 uzerinden izlemek.
# - Uc fiziksel SCT soketini ve diger GPIO baglantilarini degistirmemek.
#
# BAGLANTILAR (KULLANICI BILDIRIMI):
# - Aktif SCT: 3. disi yuva / mavi sinyal -> GPIO34 (ADC1_CH6)
# - Ortak bias: turuncu sinyal -> GPIO35 (ADC1_CH7)
# - Pasif birakilan SCT hatlari: GPIO32 (sari) ve GPIO33 (yesil).
#   Bu pinler donanimda kalir; bu firmware'de okunmaz.
#
# AKIM DONUSUMU:
# - Baslangic varsayimi: SCT-013-030 nominal 30 A / 1 V.
# - 1.0 V RMS -> 30.0 A (30 A/V).
# - Katsayi saha kalibrasyonu degildir; CT modeli teyidi ve
#   referans cihazla eszamanli karsilastirma gerekir.
#
# BEKLENEN:
# - HA'da tek akim entity'si: ESP32D1 SCT 3 Current (A).
# - HA'da ortak bias entity'si: ESP32D1 Common Bias ADC Voltage (V).
# - ESPHome logunda sct_current etiketiyle yalniz SCT-3 akimi.
# - ADC gerilim tanisi yalniz aktif GPIO34 ve ortak GPIO35 icin.
#
# SINIRLAR:
# - Bu kod guc, enerji, PF, harmonik, FFT veya THD hesaplamaz.
# - Tek kanal yapisi, uc ct_clamp sensorunun zamanlama/yuk etkisini
#   ayirmak icin kontrollu test surumudur; kalite artisi henuz kanitli degil.
#
# GUVENLIK:
# - ADC pinlerine 5 V uygulanmaz; analog tepe gerilimi ADC giris
#   sinirlari icinde kalmalidir.
# - SCT yalniz tek yalıtılmış iletkeni kavrar; faz+nötr birlikte degil.
# - SCT/kanal degisikligi yuk enerjisizken yapilir.
# ============================================================

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  # Aktif SCT-3 ADC kaynak sensoru.
  # ct_clamp, sample() metodunu 200 ms pencere boyunca hizli okur.
  # 1 s aralikli ADC yayini yalniz HA/log tani amaciyla korunur.
  - platform: adc
    pin: GPIO34
    name: "ESP32D1 SCT 3 ADC Voltage"
    id: sct_3_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "SCT-3 GPIO34 ADC = %.3f V", x);

  # Ortak bias izleme. Akim kanali degildir.
  - platform: adc
    pin: GPIO35
    name: "ESP32D1 Common Bias ADC Voltage"
    id: common_bias_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "COMMON BIAS GPIO35 ADC = %.3f V", x);

  # Tek aktif akim hesaplayicisi: SCT-3 / GPIO34.
  - platform: ct_clamp
    sensor: sct_3_adc_voltage
    name: "ESP32D1 SCT 3 Current"
    id: sct_3_current
    sample_duration: 200ms
    update_interval: 5s
    unit_of_measurement: "A"
    accuracy_decimals: 3
    device_class: current
    state_class: measurement
    filters:
      - calibrate_linear:
          - 0.0 -> 0.0
          - 1.0 -> 30.0
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_current", "SCT-3 GPIO34 CURRENT = %.3f A (nominal 30A/V)", x);
