# ============================================================
# BERO MODUL 2 — ESP32D1
# UC SCT GIRISI + TEK ORTAK BIAS OKUMA
# DURUM: YALNIZ ESPHOME TEMEL ISKELETI; ADC/SCT KODU YOK
# ============================================================
#
# AMAC:
# Modul 2 icindeki gomulu ESP32D1 cihazinin temel ESPHome
# baglantisini tanimlamak. Uc SCT sinyali ve bir ortak bias
# ADC girisi daha sonra, kart/shield pinleri dogrulaninca eklenecek.
#
# DONANIM HEDEFI:
# - ESP32 karti ve GPIO shield modül icinde.
# - ESP32 harici 5 V DC ile beslenecek.
# - USB portu PC'ye baglanti/servis erisimi saglayacak.
# - 3 adet 3.5 mm disi SCT girisi.
# - Mini breadboard uzerinde kayitli ortak bias devresi.
# - 3 ayri SCT sinyali + 1 ortak bias noktasi okuma hedefi.
#
# BILDIRILEN BAGLANTILAR:
# - 1. disi SCT yuvasi sari sinyal kablosu -> shield GPIO32.
# - 2. disi SCT yuvasi yesil sinyal kablosu -> shield GPIO33.
# - 3. SCT sinyali GPIO'su henuz belirlenmedi.
# - Ortak bias ADC GPIO'su henuz belirlenmedi.
#
# BAGLANTI / GUVENLIK:
# - Bias devresi ve ESP32 GND ortak referans olacak; kesin noktalar
#   fiziksel kart ve breadboard uzerinden teyit edilecek.
# - Harici 5 V ADC/GPIO girislerine uygulanmaz.
# - PC USB ile harici 5 V ayni anda kullanilacaksa kartin guc yolu
#   ve geri besleme korumasi once dogrulanmalidir.
# - Jack tip/ring/sleeve pinleri henuz tam dogrulanmamistir.
#
# BEKLENTI:
# Bu iskelet yalniz ESPHome cihazini Wi-Fi/API/OTA ile tanimlar.
# Henüz SCT akimi, ADC veya bias sensor verisi yayinlamaz.
#
# ============================================================

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
