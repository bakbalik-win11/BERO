# ============================================================
# BERO MODUL 2 — ESP32D1
# UC SCT GIRISI + TEK ORTAK BIAS OKUMA
# SURUM: 100 W KANAL TESTI / ADC LOG
# DURUM: KOD HAZIR; DERLEME VE DONANIM TESTI BEKLIYOR
# ============================================================
#
# AMAC:
# - SCT-1, SCT-2 ve SCT-3 sinyal girislerini ayri ayri okumak.
# - Ayni 100 W akkor ampul ile uc kanali sirayla test etmek.
# - Ortak bias seviyesini GPIO35'ten okumak ve ESPHome loguna yazmak.
#
# BAGLANTILAR (KULLANICI BILDIRIMI; FIZIKSEL TEYIT BEKLIYOR):
# - SCT-1 / sari sinyal       -> GPIO32 (ADC1_CH4)
# - SCT-2 / yesil sinyal      -> GPIO33 (ADC1_CH5)
# - SCT-3 / mavi sinyal       -> GPIO34 (ADC1_CH6)
# - Ortak bias / turuncu      -> GPIO35 (ADC1_CH7)
#
# BEKLENEN:
# - Dört ADC sensörü Home Assistant'ta görünür.
# - Her kanal 1 saniyede bir anlık ADC gerilimi yayınlar.
# - Her örnek ESPHome loguna kanal adı, GPIO ve voltaj ile yazılır.
# - GPIO35 ortak bias değeri de her saniye logda görünür.
#
# ONEMLI SINIR:
# - Bu kod anlık ADC gerilimi okur; RMS veya akım hesaplamaz.
# - 1 saniyelik örnekleme AC dalga şeklini yakalamaz.
# - Test amacı kanalların 100 W yük karşısındaki okuma değişimini
#   ve ortak bias seviyesinin kararlılığını gözlemlemektir.
#
# GUVENLIK:
# - ADC pinlerine 5 V uygulanmaz.
# - Analog dugum gerilimleri ADC giris sinirlari icinde olculmeden
#   ESP32 pinlerine baglanmaz.
# - ESP32 GND ile bias devresi GND ortak referans olmalidir.
# - Jack tip/ring/sleeve eslesmeleri henuz fiziksel olarak teyit edilmedi.
# - Harici 5 V ve PC USB ayni anda, kartin guc yolu dogrulanmadan
#   baglanmaz.
# ============================================================

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  # SCT-1: sari kablo / GPIO32. Anlik ADC voltaji.
  - platform: adc
    pin: GPIO32
    name: "ESP32D1 SCT 1 ADC Voltage"
    id: sct_1_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "SCT-1 GPIO32 ADC = %.3f V", x);

  # SCT-2: yesil kablo / GPIO33. Anlik ADC voltaji.
  - platform: adc
    pin: GPIO33
    name: "ESP32D1 SCT 2 ADC Voltage"
    id: sct_2_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "SCT-2 GPIO33 ADC = %.3f V", x);

  # SCT-3: mavi kablo / GPIO34. Anlik ADC voltaji.
  - platform: adc
    pin: GPIO34
    name: "ESP32D1 SCT 3 ADC Voltage"
    id: sct_3_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "SCT-3 GPIO34 ADC = %.3f V", x);

  # Ortak bias: turuncu kablo / GPIO35. Her saniye loga yazilir.
  - platform: adc
    pin: GPIO35
    name: "ESP32D1 Common Bias ADC Voltage"
    id: common_bias_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "COMMON BIAS GPIO35 ADC = %.3f V", x);
