# ============================================================
# BERO MODUL 2 — ESP32D1
# UC SCT GIRISI + TEK ORTAK BIAS OKUMA
# SURUM: 3 KANAL ct_clamp AKIM OKUMASI (ILK NOMINAL KATSAYI)
# DURUM: YAPILANDIRILDI; DERLEME VE FIZIKSEL KALIBRASYON BEKLIYOR
# ============================================================
#
# AMAC:
# - SCT-1, SCT-2 ve SCT-3 kanallarindan AC akim etkin degeri okumak.
# - ESPHome ct_clamp ile 200 ms hizli ornekleme penceresi kullanmak.
# - Ortak bias seviyesini GPIO35'ten izlemeye devam etmek.
# - ADC gerilimlerini de HA'da tani/inceleme icin korumak.
#
# BAGLANTILAR (KULLANICI BILDIRIMI):
# - SCT-1 / sari sinyal       -> GPIO32 (ADC1_CH4)
# - SCT-2 / yesil sinyal      -> GPIO33 (ADC1_CH5)
# - SCT-3 / mavi sinyal       -> GPIO34 (ADC1_CH6)
# - Ortak bias / turuncu      -> GPIO35 (ADC1_CH7)
#
# AKIM DONUSUMU:
# - SCT-013-030 nominal cikisi: 30 A giriste 1 V cikis.
# - Ilk nominal donusum: 1.0 V RMS -> 30.0 A (30 A/V).
# - Bu katsayi saha kalibrasyonu degildir; ilk gozlem katsayisidir.
# - Her kanal icin U200B+ / PZEM karsilastirmasiyla ayri kalibrasyon
#   yapilabilir. Simdilik kanallar ayni nominal CT tipini varsayar.
#
# BEKLENEN:
# - HA'da uc ayri akim entity'si (A), uc ADC voltaj entity'si (V)
#   ve bir ortak bias entity'si (V) gorunur.
# - Akim ornekleme penceresi 200 ms; yayin araliklari kanallarda
#   5 s / 5.5 s / 6 s olarak ayrilarak baslangic cakismasi azaltildi.
#
# SINIRLAR:
# - ct_clamp AC RMS/etkin deger hesaplar; gercek dogruluk kalibrasyona
#   ve analog devrenin/ADC'nin davranisina baglidir.
# - Bu kod guc, enerji, PF, harmonik veya FFT hesaplamaz.
# - Ilk 30 A/V donusumu dogrulanmis olcum sonucu degildir.
#
# GUVENLIK:
# - ADC pinlerine 5 V uygulanmaz; analog tepe gerilimi bias etrafinda
#   ADC giris sinirlari icinde kalmalidir.
# - SCT yalniz tek yalıtılmış iletkeni kavrar; faz+nötr birlikte degil.
# - CT konumu/kanali degistirilirken yuk enerjisiz birakilir.
# ============================================================

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  # ADC kaynaklari: ct_clamp bu sensorlerin sample() fonksiyonunu
  # 200 ms boyunca hizli dongude cagirir. 1s degerleri ayrica HA'da
  # yavas gerilim gozlemi icin korunmustur.
  - platform: adc
    pin: GPIO32
    name: "ESP32D1 SCT 1 ADC Voltage"
    id: sct_1_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "SCT-1 GPIO32 ADC = %.3f V", x);

  - platform: adc
    pin: GPIO33
    name: "ESP32D1 SCT 2 ADC Voltage"
    id: sct_2_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "SCT-2 GPIO33 ADC = %.3f V", x);

  - platform: adc
    pin: GPIO34
    name: "ESP32D1 SCT 3 ADC Voltage"
    id: sct_3_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "SCT-3 GPIO34 ADC = %.3f V", x);

  - platform: adc
    pin: GPIO35
    name: "ESP32D1 Common Bias ADC Voltage"
    id: common_bias_adc_voltage
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_test", "COMMON BIAS GPIO35 ADC = %.3f V", x);

  # SCT-1 current: GPIO32 / yellow.
  - platform: ct_clamp
    sensor: sct_1_adc_voltage
    name: "ESP32D1 SCT 1 Current"
    id: sct_1_current
    sample_duration: 200ms
    update_interval: 5s
    unit_of_measurement: "A"
    accuracy_decimals: 3
    device_class: current
    state_class: measurement
    filters:
      - calibrate_linear:
          - 0.0 -> 0.0
          - 1.0 -> 30.0
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_current", "SCT-1 GPIO32 CURRENT = %.3f A (nominal 30A/V)", x);

  # SCT-2 current: GPIO33 / green.
  - platform: ct_clamp
    sensor: sct_2_adc_voltage
    name: "ESP32D1 SCT 2 Current"
    id: sct_2_current
    sample_duration: 200ms
    update_interval: 5500ms
    unit_of_measurement: "A"
    accuracy_decimals: 3
    device_class: current
    state_class: measurement
    filters:
      - calibrate_linear:
          - 0.0 -> 0.0
          - 1.0 -> 30.0
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_current", "SCT-2 GPIO33 CURRENT = %.3f A (nominal 30A/V)", x);

  # SCT-3 current: GPIO34 / blue.
  - platform: ct_clamp
    sensor: sct_3_adc_voltage
    name: "ESP32D1 SCT 3 Current"
    id: sct_3_current
    sample_duration: 200ms
    update_interval: 6s
    unit_of_measurement: "A"
    accuracy_decimals: 3
    device_class: current
    state_class: measurement
    filters:
      - calibrate_linear:
          - 0.0 -> 0.0
          - 1.0 -> 30.0
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_current", "SCT-3 GPIO34 CURRENT = %.3f A (nominal 30A/V)", x);
