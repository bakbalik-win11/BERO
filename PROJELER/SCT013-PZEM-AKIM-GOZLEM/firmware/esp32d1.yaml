# ============================================================
# BERO MODUL 2 — ESP32D1
# GECE BOYU TEK SCT KANALI KAYIT SURUMU
# AKTIF: SCT-1 / GPIO32 + ORTAK BIAS / GPIO35
# ============================================================
#
# AMAC:
# - Yalniz SCT-1 soketine takili CT ile uzun sureli akim gozlemi.
# - ct_clamp ile her 5 saniyede bir 200 ms olcum penceresi.
# - SCT-1 ADC ve ortak bias gerilimlerini 5 saniyede bir izleme.
#
# BAGLANTILAR (KULLANICI BILDIRIMI):
# - SCT-1 / 1 numarali soket / sari sinyal -> GPIO32 (ADC1_CH4)
# - Ortak bias / turuncu sinyal           -> GPIO35 (ADC1_CH7)
# - GPIO33 ve GPIO34 bu firmware'de okunmaz.
#
# AKIM DONUSUMU:
# - Baslangic varsayimi: SCT-013-030, 30 A / 1 V (30 A/V).
# - CT modeli SCT-1 icin farkliysa bu katsayi dogru degildir.
# - Katsayi saha kalibrasyonu veya dogruluk garantisi degildir.
#
# KAYIT:
# - Akim, SCT-1 ADC ve bias entity'leri 5 saniyede bir guncellenir.
# - ESPHome logunda sct_night etiketiyle degerler yazilir.
# - HA Recorder etkinse entity durumlari HA gecmisinde saklanir.
# - ESPHome canli log ekrani tek basina kalici arsiv garantisi vermez.
#
# BEKLENEN:
# - ESP32D1 SCT 1 Current (A)
# - ESP32D1 SCT 1 ADC Voltage (V)
# - ESP32D1 Common Bias ADC Voltage (V)
#
# SINIRLAR:
# - PF, guc, enerji, harmonik, FFT veya THD hesaplanmaz.
# - ADC voltaj entity'si yavas tani ornegidir; ct_clamp'in hizli
#   orneklemesinin yerine gecmez.
# - Uzun kayit, olcum dogrulugunu tek basina kanitlamaz.
#
# GUVENLIK:
# - CT/SCT soket degisikligi yuk enerjisizken yapilir.
# - SCT yalniz tek yalıtılmış iletkeni kavrar; faz ve notr birlikte
#   SCT icinden gecirilmez.
# - ADC pinlerine 5 V uygulanmaz; bias dugumu ADC giris araliginda
#   kalmalidir.
# - Gece boyunca kutu kapali, kuru ve guvenli konumda tutulur.
#   Anormal isinma/koku gorulurse enerji kesilir.
# ============================================================

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  # SCT-1 ADC kaynagi: GPIO32 / ADC1_CH4.
  # Bu 5 s ADC entity'si tani amaclidir; ct_clamp hizli orneklemesi
  # kendi 200 ms penceresinde sensor.sample() ile yapilir.
  - platform: adc
    pin: GPIO32
    name: "ESP32D1 SCT 1 ADC Voltage"
    id: sct_1_adc_voltage
    attenuation: 12db
    update_interval: 5s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_night", "SCT-1 GPIO32 ADC = %.3f V", x);

  # Ortak bias izleme: GPIO35 / ADC1_CH7.
  - platform: adc
    pin: GPIO35
    name: "ESP32D1 Common Bias ADC Voltage"
    id: common_bias_adc_voltage
    attenuation: 12db
    update_interval: 5s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_night", "COMMON BIAS GPIO35 = %.3f V", x);

  # Tek aktif akim sensoru: SCT-1 / GPIO32.
  - platform: ct_clamp
    sensor: sct_1_adc_voltage
    name: "ESP32D1 SCT 1 Current"
    id: sct_1_current
    sample_duration: 200ms
    update_interval: 5s
    unit_of_measurement: "A"
    accuracy_decimals: 3
    device_class: current
    state_class: measurement
    filters:
      - calibrate_linear:
          - 0.0 -> 0.0
          - 1.0 -> 30.0
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("sct_night", "SCT-1 GPIO32 CURRENT = %.3f A", x);
