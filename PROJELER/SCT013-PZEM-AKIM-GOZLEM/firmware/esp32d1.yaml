# ============================================================
# BERO MODUL 2 — ESP32D1
# SCT-1 TEK KANAL / UZUN SURELI GECE GOZLEMI
# E00F CT_CLAMP YONTEMININ MODUL 2 PINLERINE UYARLANMIS HALI
# ============================================================
#
# AMAC:
# - Modül 2'nin 1 numarali SCT soketine bagli SCT'yi izlemek.
# - SCT-1 sinyalini GPIO32 uzerinden ct_clamp ile okumak.
# - 200 ms olcum penceresinden Raw AC (V RMS) ve akim (A)
#   degerlerini ayri entity'ler olarak yayinlamak.
# - Ortak bias noktasini GPIO35 uzerinden izlemek.
# - Gece boyunca olcum akisinin surekliligini gozlemek.
#
# MODUL 2 BAGLANTILARI:
# - SCT-1 / 1 numarali soket / sari sinyal -> GPIO32 (ADC1_CH4)
# - SCT-2 / yesil sinyal                  -> GPIO33 (BU TESTTE KULLANILMIYOR)
# - SCT-3 / mavi sinyal                   -> GPIO34 (BU TESTTE KULLANILMIYOR)
# - Ortak bias / turuncu sinyal           -> GPIO35 (ADC1_CH7)
#
# ONEMLI DONANIM FARKI:
# E00F orneginde GPIO32 ve GPIO33 ayni SCT analog dugumune,
# GPIO34 ve GPIO35 ayni bias dugumune bagliydi. Modül 2'de ise
# GPIO32/33/34 uc AYRI SCT soketidir; GPIO35 ortak bias girisidir.
# Bu nedenle E00F'deki dort ADC goruntuleme girisi bire bir
# tasinmamistir. GPIO33 ve GPIO34 baska SCT soketlerine ait oldugu
# icin bu tek kanal testinde kullanilmaz.
# RAW ADC count goruntulemesi bu pin duzeninde ek bir paralel
# analog baglanti olmadan yapilamaz; bu YAML'da RAW count entity
# yoktur. Var olan kablo duzeni degistirilmemistir.
#
# OLCUM AYARLARI:
# - ADC attenuation: 12 dB
# - SCT kaynak ADC entity yayini: 1 saniye
# - ct_clamp pencere suresi: 200 ms
# - Akim/Raw AC yayin araligi: 2 saniye
# - Akim katsayisi: 24.22 (E00F kullanici kodundan korunmustur)
# - Yazilimsal sifirlama esigi: YOK
#
# ct_clamp, GPIO32 ADC kaynagindan 200 ms boyunca hizli ornek alir.
# Bir saniyelik ADC entity yayini bu hizli pencerenin kendisi degildir.
#
# BEKLENEN ENTITY'LER:
# - ESP32D1 SCT 1 ADC Voltage (GPIO32, V)
# - BERO Mod2 SCT1 Raw AC (200 ms pencere RMS gerilimi, V)
# - BERO Mod2 SCT1 Akim (24.22 katsayili, A)
# - ESP32D1 Common Bias ADC Voltage (GPIO35, V)
#
# KATSAYI NOTU:
# 24.22, kullanicinin verdigi E00F kodundaki katsayidir; burada
# baslangic degeri olarak korunmustur. SCT-1 CT modelinin ve
# bu modüldeki analog yolun ayni oldugu teyit edilmeden yeni
# kalibrasyon veya dogruluk garantisi sayilmaz.
#
# GUVENLIK:
# - SCT soket degisikligi yuk enerjisizken yapilir.
# - SCT yalniz tek yalıtılmış iletkeni kavrar; faz ve notr birlikte
#   SCT icinden gecirilmez.
# - ADC girislerine izin verilen araligin disinda gerilim uygulanmaz.
# - Gece boyunca kutu kapali, kuru ve guvenli konumda tutulur.
#   Anormal isinma veya koku gorulurse enerji kesilir.
# ============================================================

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  # SCT-1 sinyal ADC kaynagi: GPIO32 / ADC1_CH4.
  # ct_clamp bu kaynaktan 200 ms boyunca hizli ornek alir.
  - platform: adc
    pin: GPIO32
    id: sct_1_voltage_source
    name: "ESP32D1 SCT 1 ADC Voltage"
    attenuation: 12db
    raw: false
    accuracy_decimals: 5
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    samples: 1
    force_update: true
    update_interval: 1s

  # ct_clamp penceresinden gelen RMS gerilim.
  # Bu deger GPIO32'nin tekil ADC voltaji degildir.
  - platform: template
    id: sct_1_raw_ac
    name: "BERO Mod2 SCT1 Raw AC"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 5
    force_update: true
    update_interval: never

  # SCT-1 akim: E00F kodundaki 24.22 katsayisi korunmustur.
  - platform: ct_clamp
    sensor: sct_1_voltage_source
    id: sct_1_current
    name: "BERO Mod2 SCT1 Akim"
    sample_duration: 200ms
    update_interval: 2s
    on_raw_value:
      then:
        - sensor.template.publish:
            id: sct_1_raw_ac
            state: !lambda |-
              return x;
    filters:
      - multiply: 24.22
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  # Ortak bias referansi: GPIO35 / ADC1_CH7.
  - platform: adc
    pin: GPIO35
    id: common_bias_adc_voltage
    name: "ESP32D1 Common Bias ADC Voltage"
    attenuation: 12db
    raw: false
    accuracy_decimals: 5
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    samples: 1
    force_update: true
    update_interval: 1s
