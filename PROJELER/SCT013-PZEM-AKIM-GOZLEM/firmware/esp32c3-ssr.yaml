# ============================================================
# PROJE BERO — ESP32-C3 SSR KONTROL DUGUMU
# ============================================================
#
# AMAC:
# - SSR kontrol cikisini 40 saniye ON / 20 saniye OFF dongusuyle
#   calistirmak.
# - Her ON/OFF gecisini BOOT_ID ve artan EVENT_ID ile tanimlamak.
# - Olayi UDP broadcast ile 4210 portuna yayinlamak.
# - Ayni olay kimligini ESPHome loglarinda ve Home Assistant
#   metin entity'lerinde gorunur kilmak.
# - DS3231 RTC saatini kullanmak; NTP geldiginde RTC'yi guncellemek.
# - ESP cihaz/agir bilgilerini Home Assistant'ta izlenebilir yapmak.
#
# ESP KIMLIGI:
# - ESP32-C3 (ESP-IDF framework)
# - ESPHome node name: esphome-web-0424f4
# - HA friendly name: ESP32-C3-SSR
# - SSR GPIO: GPIO6 (inverted: true)
# - DS3231 I2C: SDA GPIO0, SCL GPIO1, adres 0x68
#
# BAGLANTILAR:
# - ESP32-C3 GPIO6 -> SSR kartinin kontrol girisi
# - ESP32-C3 GND -> SSR karti kontrol GND (kart bu baglantiyi
#   gerektiriyorsa; giris gerilim seviyesini kart dokumanina gore
#   dogrula).
# - DS3231 SDA -> GPIO0
# - DS3231 SCL -> GPIO1
# - DS3231 VCC/GND -> kartin ve modulun uygun besleme/GND hatlari
#
# ONEMLI:
# - inverted: true oldugu icin ON komutunda GPIO6 fiziksel LOW,
#   OFF komutunda fiziksel HIGH olur.
# - GPIO cikis seviyesinin yazilimdan okunmasi, SSR'nin AC tarafinda
#   gercekten iletime gectigini kanitlamaz. Fiziksel yuk durumu daha
#   sonra PZEM akim verisiyle kontrol edilecektir.
# - UDP paketi: BERO_EVT,BOOT_ID=XXXXXXXX,EVENT_ID=N,STATE=ON|OFF
# - UDP hedefi: 255.255.255.255:4210
# - Dongu millis() ile yurur; RTC/NTP yalniz olay zaman damgasi icindir.
#
# BEKLENEN:
# - HA'da SSR komut durumu, BOOT_ID, EVENT_ID ve son olay gorunur.
# - HA cihaz tanilama bilgileri: IP, SSID, MAC, ESPHome surumu,
#   uptime ve Wi-Fi sinyal seviyesi.
# - Logda RTC/NTP kaynagi ve UDP gonderim sonucu gorunur.
#
# DURUM:
# - Bu YAML depo kaynak dosyasidir.
# - Derleme, cihaza yukleme ve fiziksel SSR testi henuz
#   dogrulanmamistir. Bu dosya tek basina test kaniti degildir.
#
# ============================================================

esphome:
  name: esphome-web-0424f4
  friendly_name: ESP32-C3-SSR
  name_add_mac_suffix: false

  on_boot:
    - priority: -100
      then:
        - switch.turn_off: ssr_control
        - lambda: |-
            id(bero_boot_id) = esp_random();
            id(bero_event_id) = 0;
            id(bero_last_state) = "BOOT";

            char boot_buffer[9];
            snprintf(boot_buffer, sizeof(boot_buffer), "%08X",
              (unsigned int) id(bero_boot_id));
            id(bero_boot_id_text).publish_state(boot_buffer);
            id(bero_event_id_text).publish_state("0");
            id(bero_last_state_text).publish_state("BOOT");

            ESP_LOGI("bero_event",
              "BERO_BOOT_ID=%08X EVENT_ID_START=0",
              (unsigned int) id(bero_boot_id));

            auto rtc_now = id(rtc_time).now();
            auto ntp_now = id(ntp_time).now();

            if (rtc_now.is_valid()) {
              ESP_LOGI("bero_boot_test",
                "BERO_BOOT_RTC_VALID: %04d-%02d-%02d %02d:%02d:%02d",
                rtc_now.year, rtc_now.month, rtc_now.day_of_month,
                rtc_now.hour, rtc_now.minute, rtc_now.second);
            } else {
              ESP_LOGW("bero_boot_test", "BERO_BOOT_RTC_INVALID");
            }

            if (ntp_now.is_valid()) {
              ESP_LOGI("bero_boot_test",
                "BERO_BOOT_NTP_VALID_AT_BOOT: %04d-%02d-%02d %02d:%02d:%02d",
                ntp_now.year, ntp_now.month, ntp_now.day_of_month,
                ntp_now.hour, ntp_now.minute, ntp_now.second);
            } else {
              ESP_LOGI("bero_boot_test",
                "BERO_BOOT_NTP_INVALID_AT_BOOT: waiting for NTP sync");
            }

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

external_components:
  - source: github://andrewbackway/esphome-ds3231@main
    components: [ds3231]
    refresh: 1d

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  id: bus_a
  sda: GPIO0
  scl: GPIO1
  scan: true
  frequency: 50kHz

time:
  - platform: sntp
    id: ntp_time
    timezone: Europe/Istanbul
    servers:
      - time.google.com
      - time.cloudflare.com
      - 0.pool.ntp.org
    on_time_sync:
      then:
        - logger.log:
            level: INFO
            format: "BERO_NTP_SYNC_OK: NTP time synchronized."
        - ds3231.write_time: rtc_time
        - logger.log:
            level: INFO
            format: "BERO_RTC_WRITE_COMMAND_SENT: DS3231 write action called."

  - platform: ds3231
    id: rtc_time
    i2c_id: bus_a
    address: 0x68
    update_interval: 10s
    timezone: Europe/Istanbul

switch:
  - platform: gpio
    id: ssr_control
    name: "BERO SSR Kontrol"
    pin:
      number: GPIO6
      inverted: true
    restore_mode: ALWAYS_OFF

globals:
  - id: bero_boot_id
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: bero_event_id
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: bero_last_state
    type: std::string
    restore_value: no
    initial_value: '"BOOT"'

  - id: ssr_cycle_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: ssr_cycle_initialized
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - interval: 1s
    then:
      - lambda: |-
          #include "lwip/sockets.h"
          #include "lwip/inet.h"
          #include <errno.h>
          #include <stdio.h>
          #include <string.h>

          auto log_event = [&](const char *event) {
            auto rtc = id(rtc_time).now();
            auto ntp = id(ntp_time).now();

            if (rtc.is_valid()) {
              ESP_LOGI("bero_event",
                "TIME=%04d-%02d-%02d %02d:%02d:%02d SOURCE=RTC EVENT=%s",
                rtc.year, rtc.month, rtc.day_of_month,
                rtc.hour, rtc.minute, rtc.second, event);
            } else if (ntp.is_valid()) {
              ESP_LOGI("bero_event",
                "TIME=%04d-%02d-%02d %02d:%02d:%02d SOURCE=NTP EVENT=%s",
                ntp.year, ntp.month, ntp.day_of_month,
                ntp.hour, ntp.minute, ntp.second, event);
            } else {
              ESP_LOGW("bero_event",
                "TIME=UNAVAILABLE SOURCE=NONE EVENT=%s", event);
            }
          };

          auto emit_shared_event = [&](const char *state) {
            id(bero_event_id)++;
            id(bero_last_state) = state;

            char packet[128];
            snprintf(packet, sizeof(packet),
              "BERO_EVT,BOOT_ID=%08X,EVENT_ID=%u,STATE=%s",
              (unsigned int) id(bero_boot_id),
              (unsigned int) id(bero_event_id), state);

            char event_id_buffer[16];
            snprintf(event_id_buffer, sizeof(event_id_buffer), "%u",
              (unsigned int) id(bero_event_id));
            id(bero_event_id_text).publish_state(event_id_buffer);
            id(bero_last_state_text).publish_state(state);

            static int udp_sock = -1;
            if (udp_sock < 0) {
              udp_sock = ::socket(AF_INET, SOCK_DGRAM, IPPROTO_UDP);

              if (udp_sock >= 0) {
                int broadcast_enable = 1;
                int option_result = setsockopt(udp_sock, SOL_SOCKET,
                  SO_BROADCAST, &broadcast_enable, sizeof(broadcast_enable));
                if (option_result < 0) {
                  ESP_LOGW("bero_udp",
                    "UDP_BROADCAST_OPTION_FAILED errno=%d", errno);
                }
              } else {
                ESP_LOGW("bero_udp",
                  "UDP_SOCKET_CREATE_FAILED errno=%d", errno);
              }
            }

            if (udp_sock >= 0) {
              struct sockaddr_in destination = {};
              destination.sin_family = AF_INET;
              destination.sin_port = htons(4210);
              destination.sin_addr.s_addr = inet_addr("255.255.255.255");

              int sent = sendto(udp_sock, packet, strlen(packet), 0,
                (struct sockaddr *)&destination, sizeof(destination));

              if (sent >= 0) {
                ESP_LOGI("bero_udp", "UDP_EVENT_SENT %s", packet);
              } else {
                ESP_LOGW("bero_udp", "UDP_SEND_FAILED errno=%d", errno);
              }
            }

            ESP_LOGI("bero_event",
              "BERO_SHARED_EVENT BOOT_ID=%08X EVENT_ID=%u STATE=%s",
              (unsigned int) id(bero_boot_id),
              (unsigned int) id(bero_event_id), state);
          };

          const uint32_t now_ms = millis();

          if (!id(ssr_cycle_initialized)) {
            id(ssr_cycle_start_ms) = now_ms;
            id(ssr_cycle_initialized) = true;

            emit_shared_event("ON");
            log_event("COMMAND_ON");
            id(ssr_control).turn_on();
            log_event("CYCLE_START_ON_40S");
            return;
          }

          const uint32_t elapsed_s =
            (now_ms - id(ssr_cycle_start_ms)) / 1000;

          if (elapsed_s < 40) {
            if (!id(ssr_control).state) {
              emit_shared_event("ON");
              log_event("COMMAND_ON");
              id(ssr_control).turn_on();
            }
          } else if (elapsed_s < 60) {
            if (id(ssr_control).state) {
              emit_shared_event("OFF");
              log_event("COMMAND_OFF");
              id(ssr_control).turn_off();
            }
          } else {
            id(ssr_cycle_start_ms) = now_ms;

            emit_shared_event("ON");
            log_event("COMMAND_ON");
            id(ssr_control).turn_on();
            log_event("CYCLE_RESTART_ON_40S");
          }

text_sensor:
  - platform: template
    id: bero_boot_id_text
    name: "BERO SSR Boot ID"
    update_interval: never

  - platform: template
    id: bero_event_id_text
    name: "BERO SSR Event ID"
    update_interval: never

  - platform: template
    id: bero_last_state_text
    name: "BERO SSR Son Olay"
    update_interval: never

  - platform: wifi_info
    ip_address:
      name: "BERO SSR IP"
    ssid:
      name: "BERO SSR WiFi SSID"
    mac_address:
      name: "BERO SSR MAC"

  - platform: version
    name: "BERO SSR ESPHome Surumu"

  - platform: template
    name: "BERO NTP Saat"
    update_interval: 5s
    lambda: |-
      auto now = id(ntp_time).now();
      if (!now.is_valid()) {
        ESP_LOGW("ntp_test", "NTP_TIME_INVALID");
        return {"NTP_TIME_INVALID"};
      }
      char buffer[24];
      snprintf(buffer, sizeof(buffer), "%04d-%02d-%02d %02d:%02d:%02d",
        now.year, now.month, now.day_of_month, now.hour, now.minute, now.second);
      ESP_LOGI("ntp_test", "NTP_TIME: %s", buffer);
      return {buffer};

  - platform: template
    name: "BERO DS3231 RTC Saat"
    update_interval: 5s
    lambda: |-
      auto now = id(rtc_time).now();
      if (!now.is_valid()) {
        ESP_LOGW("rtc_test", "RTC_TIME_INVALID");
        return {"RTC_TIME_INVALID"};
      }
      char buffer[24];
      snprintf(buffer, sizeof(buffer), "%04d-%02d-%02d %02d:%02d:%02d",
        now.year, now.month, now.day_of_month, now.hour, now.minute, now.second);
      ESP_LOGI("rtc_test", "RTC_TIME: %s", buffer);
      return {buffer};

sensor:
  - platform: uptime
    name: "BERO SSR Uptime"
    update_interval: 60s

  - platform: wifi_signal
    name: "BERO SSR WiFi Sinyal"
    update_interval: 60s

button:
  - platform: template
    name: "BERO DS3231 Saati NTP'den Yaz"
    on_press:
      then:
        - if:
            condition:
              time.has_time:
                id: ntp_time
            then:
              - logger.log:
                  level: INFO
                  format: "BERO_MANUAL_RTC_WRITE_START"
              - ds3231.write_time: rtc_time
              - logger.log:
                  level: INFO
                  format: "BERO_MANUAL_RTC_WRITE_COMMAND_SENT"
            else:
              - logger.log:
                  level: WARN
                  format: "BERO_MANUAL_RTC_WRITE_ABORTED: NTP time invalid."
