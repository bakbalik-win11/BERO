# ============================================================
# BERO — CT / AC RMS OKUMA REFERANSI
# DOSYA: firmware/patterns/ct-clamp-ac-rms-reference.yaml
# DURUM: ACIKLAMALI REFERANS SABLONU; DERLEME/FIZIKSEL TEST YOK
# ============================================================
#
# AMAC
# - Bir akim trafosunun (CT/SCT) analog AC cikisini ADC ile okumak.
# - ESPHome ct_clamp ile bir pencere icindeki AC RMS gerilimini hesaplamak.
# - Ham AC RMS gerilimini (V) ve katsayili akim sonucunu (A)
#   iki ayri Home Assistant entity'si olarak sunmak.
# - Bias noktasini ayri bir ADC entity'siyle gozlemlemek.
#
# BAGLANTI VARSAYIMI — BU DOSYA ICIN
# - CT sinyali -> GPIO32 (klasik ESP32 / ADC1_CH4 varsayimi).
# - Bias gozlem noktasi -> GPIO35 (klasik ESP32 / ADC1_CH7 varsayimi).
# - CT ve bias analog devresi yalniz dusuk gerilim tarafindadir.
# - ADC girisi ESP32'nin izin verilen araligini asmamalidir.
# - SCT soket/pin eslemesi kart ve shield uzerinde fiziksel olarak
#   dogrulanmadan bu dosya cihaza yuklenmez.
#
# ONEMLI
# - GPIO32/35 burada referans pinlerdir; her ESP32 kartinda ayni
#   shield terminalinde olduklari varsayilmaz.
# - BERO Modül 2'de GPIO32 SCT-1, GPIO35 ortak bias olarak kayitlidir.
# - BERO'nun 24.22 katsayisi yalniz mevcut SCT/analog zincirinin
#   tarihsel baslangic degeridir; baska CT'ye kopyalanmaz.
# - sample_duration pencere acik kalma suresidir.
# - update_interval yeni pencerenin baslama araligidir.
# - ADC entity update_interval: 1s, ct_clamp'in hizli ornekleme
#   penceresi DEGILDIR.
# - last_value tekrar filtresi ESPHome ct_clamp icindedir; YAML
#   parametresi degildir ve ADC sample() cagrisindan sonra calisir.
#
# BEKLENEN ENTITY'LER
# 1) CT ADC Source Voltage: GPIO32'nin ADC voltaj yayini (V).
# 2) CT Raw AC RMS Voltage: ct_clamp penceresinin AC RMS gerilimi (V).
# 3) CT Current: Raw AC RMS x 24.22 (A; yalniz BERO baslangic katsayisi).
# 4) CT Bias Monitor: GPIO35 bias gerilim gozlemi (V).
#
# GUVENLIK
# - SCT yalniz tek yalitilmis faz iletkenini kavrar; faz ve notr
#   birlikte SCT icinden gecirilmez.
# - CT sekonderi, uretici talimati izin vermedikce primer akim
#   gecerken acik devre birakilmaz.
# - Sinyal/jack degisikligi yuk enerjisizken yapilir.
# - Sebeke tarafinda acik breadboard kullanilmaz.
# ============================================================

esphome:
  name: bero-ct-ref
  friendly_name: BERO CT RMS Reference
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  # ----------------------------------------------------------
  # 1) ADC KAYNAGI
  # ----------------------------------------------------------
  # Bu ADC entity'si pinin tekil gerilim degerini Home Assistant'a
  # yaklasik 1 saniyelik aralikla gosterir.
  # ct_clamp ise ayni kaynak nesnesini pencere icinde kendi
  # sample() cagrisiyla daha sik okur. Bu iki akis ayni sey degildir.
  - platform: adc
    pin: GPIO32
    id: ct_voltage_source
    name: "CT ADC Source Voltage"
    attenuation: 12db
    raw: false
    accuracy_decimals: 5
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    samples: 1
    force_update: true
    update_interval: 1s

  # ----------------------------------------------------------
  # 2) ct_clamp ONCESI AC RMS GERILIM ENTITY'SI
  # ----------------------------------------------------------
  # ct_clamp'in on_raw_value tetiginden gelen x, multiply filtresi
  # uygulanmadan onceki degerdir. Bu entity A degil, V RMS
  # cinsinden AC gerilim sonucudur.
  - platform: template
    id: ct_raw_ac_rms_voltage
    name: "CT Raw AC RMS Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 5
    force_update: true
    update_interval: never

  # ----------------------------------------------------------
  # 3) CT CLAMP — AC RMS VE AKIM OLCEKLEME
  # ----------------------------------------------------------
  # sample_duration: pencere icinde ornek alma suresi.
  # 200ms, 50Hz nominal sebeke icin 10 tam periyottur.
  # update_interval: yeni pencerenin baslama araligi.
  # 2s degeri 200ms pencere demek degildir.
  #
  # on_raw_value: filtre/katsayi oncesi AC RMS gerilimini ayri
  # entity'ye aktarir.
  #
  # multiply: 24.22: BERO'nun tarihsel baslangic katsayisi.
  # Yeni CT veya analog on uc icin kalibrasyon yapilmadan tasinmaz.
  - platform: ct_clamp
    sensor: ct_voltage_source
    id: ct_current
    name: "CT Current"
    sample_duration: 200ms
    update_interval: 2s
    on_raw_value:
      then:
        - sensor.template.publish:
            id: ct_raw_ac_rms_voltage
            state: !lambda |-
              return x;
    filters:
      - multiply: 24.22
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  # ----------------------------------------------------------
  # 4) BIAS GOZLEM KANALI
  # ----------------------------------------------------------
  # Bias noktasi ayrica izlenir. Bu 1 saniyelik entity yayini,
  # ct_clamp'in 200ms penceresindeki her ornekle eszamanli degildir.
  - platform: adc
    pin: GPIO35
    id: ct_bias_voltage
    name: "CT Bias Monitor"
    attenuation: 12db
    raw: false
    accuracy_decimals: 5
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    samples: 1
    force_update: true
    update_interval: 1s
