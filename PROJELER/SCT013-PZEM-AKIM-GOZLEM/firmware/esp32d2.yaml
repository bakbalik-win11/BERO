# BERO E00F - ESP32D2 / SCT013-030
#
# HEDEF:
# E00F-N01 gece gözleminde 0.35 A altını sıfırlayan yazılım filtresini
# kaldırarak ct_clamp'in düşük akım çıktısını ve yüksüz taban davranışını
# Home Assistant geçmişinde gözlemek. Bu bir teşhis yapılandırmasıdır.
#
# BAĞLANTILAR:
# SCT013-030 -> mevcut bias devresi -> ESP32 GPIO33
# Mevcut 1.65 V bias devresi korunacaktır.
#
# ÖLÇÜM AYARLARI:
# ADC: GPIO33, ADC1, 12 dB
# Örnekleme penceresi: 200 ms
# Yayın aralığı: 2 saniye
# SCT nominal katsayısı: 24.22
# Sıfırlama eşiği: YOK (lambda filtresi kaldırıldı)
#
# BEKLENTİ:
# ct_clamp tarafından hesaplanan 0.35 A altı değerler de yayınlanır.
# Düşük seviyedeki gürültü/yanlış pozitifler de görünür olabilir.
#
# ÖNEMLİ:
# Bu sürümde yazılımsal sıfırlama eşiği yoktur.
# 24.22 katsayısı ve ct_clamp hesaplama yolu korunmuştur.
# Bu değişiklik gürültüyü filtrelemez; düşük değerleri görünür kılar.
#
# LOG:
# 2026-10-30 tarihinde yüksüz testte 6/6 yayın 0.000 A görüldü.
# 150 W akkor ve kettle yüklerinde ölçüm karşılaştırmaları yapıldı.
# 8.35 W LED testinde 0.041 A pens akımı eşik altında kaldığı için
# yayınlanan değerlerin çoğu 0.000 A oldu; nadir yüksek sıçramalar görüldü.
#
# SONUÇ:
# 0.35 A eşiği yüksüz çıktıyı bastırıyor; düşük akım ölçümünü gizliyor.
# Eşik davranışı sonraki çalışmada ayrıca değerlendirilecek.
#
# KAYNAK:
# Kullanıcının 2026-10-30 tarihinde paylaştığı ve cihaz loglarında
# çalışan ESPHome yapılandırması. Açıklama eşiği, lambda ile aynı
# olacak şekilde 0.35 A olarak tutarlılaştırıldı.

esphome:
  name: esp32d2
  friendly_name: BERO E00F ESP32D2
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: adc
    pin: GPIO33
    id: sct_voltage_source
    attenuation: 12db
    raw: false
    samples: 1
    sampling_mode: avg
    internal: true

  - platform: ct_clamp
    sensor: sct_voltage_source
    id: sct_current
    name: "BERO E00F SCT013 Akim"
    sample_duration: 200ms
    update_interval: 2s
    filters:
      - multiply: 24.22
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
