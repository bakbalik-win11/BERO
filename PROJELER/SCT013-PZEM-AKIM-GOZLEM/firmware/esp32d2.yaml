# ============================================================
# BERO E00F - ESP32D2
# SCT013 + BIAS / DORT ADC HATTI GECE GOZLEMI
# ============================================================
#
# AMAC:
# Yuksuz gece gozleminde SCT analog dugumunu ve bias referansini
# iki farkli ADC okuma yoluyla izlemek.
#
# BAGLANTILAR:
# GPIO32 = SCT analog dugumu / RAW ADC count
# GPIO33 = Ayni SCT analog dugumu / ADC voltaj tahmini
# GPIO34 = Bias Vmid noktasi / RAW ADC count
# GPIO35 = Ayni Bias Vmid noktasi / ADC voltaj tahmini
#
# ESP32 GND ile bias devresi GND ortak olmalidir.
# GPIO32-33 ayni SCT dugumune bagli olmalidir.
# GPIO34-35 ayni bias referans noktasina bagli olmalidir.
#
# OLCUM AYARLARI:
# ADC: 12 dB attenuation
# Dort ADC goruntuleme kanali: 1 saniye
# SCT ct_clamp penceresi: 200 ms
# SCT yayin araligi: 2 saniye
# SCT katsayisi: 24.22
# Yazilimsal sifirlama esigi: YOK
#
# GPIO33 ayni zamanda ct_clamp'in hizli ornekleme kaynagidir.
# Bir saniyelik ADC yayinlari, ct_clamp'in 200 ms penceresini
# degistirmez; kaynak ADC ornekleri pencere boyunca okunur.
#
# BEKLENTI:
# Home Assistant'ta dort ADC entity'si, SCT Raw AC ve SCT Akim
# ayri ayri izlenir.
#
# SINIRLAR:
# Bir saniyelik ADC yayinlari yuksek hizli ham dalga kaydi degildir.
# GPIO32/33 ve GPIO34/35 okumalarinin tam eszamanli oldugu
# iddia edilmez.
# RAW count -> voltaj donusumu kalibrasyon degildir.
#
# GUVENLIK:
# ADC girislerine ESP32'nin izin verilen gerilim araligi disinda
# gerilim uygulanmamali. Fiziksel baglantilari enerji kesikken yap.
# Sebeke tarafinda acik breadboard kullanma.
#
# ============================================================

esphome:
  name: esp32d2
  friendly_name: BERO E00F ESP32D2
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:

  # ----------------------------------------------------------
  # 1 - SCT GPIO32 / RAW ADC COUNT
  # ----------------------------------------------------------

  - platform: adc
    pin: GPIO32
    id: sct_gpio32_raw
    name: "BERO E00F SCT GPIO32 RAW"
    attenuation: 12db
    raw: true
    accuracy_decimals: 0
    unit_of_measurement: "count"
    state_class: measurement
    samples: 1
    force_update: true
    update_interval: 1s

  # ----------------------------------------------------------
  # 2 - SCT GPIO33 / ADC VOLTAJ
  # Ayni ADC kaynagi ct_clamp tarafindan hizli okunur.
  # ----------------------------------------------------------

  - platform: adc
    pin: GPIO33
    id: sct_voltage_source
    name: "BERO E00F SCT GPIO33 ADC Voltage"
    attenuation: 12db
    raw: false
    accuracy_decimals: 5
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    samples: 1
    force_update: true
    update_interval: 1s

  # ----------------------------------------------------------
  # SCT RAW AC / CT CLAMP PENCERESINDEN GELEN RMS GERILIM
  # Bu deger GPIO33'un anlik ADC voltaji degildir.
  # 200 ms pencerenin AC RMS gerilim degeridir.
  # ----------------------------------------------------------

  - platform: template
    id: sct_raw_ac
    name: "BERO E00F SCT013 Raw AC"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 5
    force_update: true
    update_interval: never

  # ----------------------------------------------------------
  # SCT AKIM / MEVCUT CT CLAMP YOLU
  # ----------------------------------------------------------

  - platform: ct_clamp
    sensor: sct_voltage_source
    id: sct_current
    name: "BERO E00F SCT013 Akim"
    sample_duration: 200ms
    update_interval: 2s

    on_raw_value:
      then:
        - sensor.template.publish:
            id: sct_raw_ac
            state: !lambda |-
              return x;

    filters:
      - multiply: 24.22

    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  # ----------------------------------------------------------
  # 3 - BIAS GPIO34 / RAW ADC COUNT
  # ----------------------------------------------------------

  - platform: adc
    pin: GPIO34
    id: bias_gpio34_raw
    name: "BERO E00F Bias GPIO34 RAW"
    attenuation: 12db
    raw: true
    accuracy_decimals: 0
    unit_of_measurement: "count"
    state_class: measurement
    samples: 1
    force_update: true
    update_interval: 1s

  # ----------------------------------------------------------
  # 4 - BIAS GPIO35 / ADC VOLTAJ
  # ----------------------------------------------------------

  - platform: adc
    pin: GPIO35
    id: bias_gpio35_voltage
    name: "BERO E00F Bias GPIO35 ADC Voltage"
    attenuation: 12db
    raw: false
    accuracy_decimals: 5
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    samples: 1
    force_update: true
    update_interval: 1s
