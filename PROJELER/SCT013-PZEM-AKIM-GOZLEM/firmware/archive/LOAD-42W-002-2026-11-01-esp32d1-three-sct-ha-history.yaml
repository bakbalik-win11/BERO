# ============================================================
# BERO MODÜL 2 — ESP32D1
# LOAD-42W-002 — ÜÇ SCT / HA GEÇMİŞ KAYDI
# ESPHome 2026.10.1
# ============================================================
#
# AMAÇ:
# - 42 W ampul yükünde üç SCT kanalını uzun süre izlemek.
# - SCT1: Faz iletkeni, 1 primer tur.
# - SCT2: Nötr iletkeni, 1 primer tur.
# - SCT3: Faz iletkeni, 2 primer tur.
# - Ortak bias değerini GPIO35 üzerinden izlemek.
# - Akım, Raw AC ve bias sensörlerini Home Assistant'a
#   yayımlayarak HA Recorder/History geçmişine aktarmak.
#
# DONANIM BAĞLANTILARI:
# - SCT1 sarı sinyal  -> GPIO32 / ADC1_CH4 / Faz 1T
# - SCT2 yeşil sinyal -> GPIO33 / ADC1_CH5 / Nötr 1T
# - SCT3 mavi sinyal  -> GPIO34 / ADC1_CH6 / Faz 2T
# - Ortak bias turuncu -> GPIO35 / ADC1_CH7
#
# FİZİKSEL DÜZEN:
# - Her SCT yalnız kendi izlediği tek yalıtılmış iletkeni kavrar.
# - Faz ve nötr aynı SCT açıklığından birlikte geçirilmez.
# - SCT3'te iki tur, faz iletkeninin çekirdekten iki geçişidir.
# - SCT sekonder kablosu sarılmaz.
#
# OKUMA SIRASI:
# SCT1 -> 250 ms -> SCT2 -> 250 ms -> SCT3 -> 250 ms -> Bias
#
# SABİTLER:
# - ct_clamp sample_duration: 200ms
# - Kanal slotu: 250ms (200ms pencere + 50ms bekleme)
# - Çevrim aralığı: 2s
# - Katsayı: K=24.22 (değiştirilmedi)
# - ADC attenuation: 12 dB
# - ESPHome framework: ESP-IDF
#
# HA GEÇMİŞ KAYDI:
# - Akım, Raw AC ve bias sensörlerinde force_update: true.
# - Recorder etkin olmalı; sensörler recorder.exclude altında
#   bulunmamalıdır.
# - Geçmiş saklama süresi Home Assistant Recorder ayarına bağlıdır.
# - force_update, aynı değerin yeniden yayımlanmasını sağlar;
#   HA veritabanı yazma miktarını artırabilir.
#
# BEKLENEN HA SENSÖRLERİ:
# - BERO Mod2 SCT1 Faz 1T Akim
# - BERO Mod2 SCT1 Faz 1T Raw AC
# - BERO Mod2 SCT2 Notr 1T Akim
# - BERO Mod2 SCT2 Notr 1T Raw AC
# - BERO Mod2 SCT3 Faz 2T Akim
# - BERO Mod2 SCT3 Faz 2T Raw AC
# - BERO Mod2 Ortak Bias
#
# GÜVENLİK:
# - Şebeke bağlantıları kapalı ve uygun korumalı düzende olmalı.
# - SCT bağlantıları yalnız enerji kesikken değiştirilmelidir.
# - CT sekonderi üretici talimatı aksini söylemedikçe primer
#   akım geçerken açık bırakılmamalıdır.
# ============================================================

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  # ----------------------------------------------------------
  # DAHİLİ ADC KAYNAKLARI
  # ----------------------------------------------------------

  # SCT1 — Faz 1T — GPIO32
  - platform: adc
    id: sct_1_voltage_source
    name: "ESP32D1 SCT1 ADC Source"
    pin: GPIO32
    attenuation: 12db
    raw: false
    samples: 1
    internal: true
    update_interval: never

  # SCT2 — Nötr 1T — GPIO33
  - platform: adc
    id: sct_2_voltage_source
    name: "ESP32D1 SCT2 ADC Source"
    pin: GPIO33
    attenuation: 12db
    raw: false
    samples: 1
    internal: true
    update_interval: never

  # SCT3 — Faz 2T — GPIO34
  - platform: adc
    id: sct_3_voltage_source
    name: "ESP32D1 SCT3 ADC Source"
    pin: GPIO34
    attenuation: 12db
    raw: false
    samples: 1
    internal: true
    update_interval: never

  # ----------------------------------------------------------
  # ORTAK BIAS — GPIO35
  # ----------------------------------------------------------
  - platform: adc
    id: common_bias_adc_voltage
    name: "BERO Mod2 Ortak Bias"
    pin: GPIO35
    attenuation: 12db
    raw: false
    samples: 1
    accuracy_decimals: 5
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    force_update: true
    update_interval: never

  # ----------------------------------------------------------
  # SCT1 — FAZ 1 TUR / GPIO32
  # ----------------------------------------------------------
  - platform: template
    id: sct_1_raw_ac
    name: "BERO Mod2 SCT1 Faz 1T Raw AC"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 5
    force_update: true
    update_interval: never

  - platform: ct_clamp
    id: sct_1_current
    name: "BERO Mod2 SCT1 Faz 1T Akim"
    sensor: sct_1_voltage_source
    sample_duration: 200ms
    update_interval: never
    force_update: true
    on_raw_value:
      then:
        - sensor.template.publish:
            id: sct_1_raw_ac
            state: !lambda |-
              return x;
    filters:
      - multiply: 24.22
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  # ----------------------------------------------------------
  # SCT2 — NÖTR 1 TUR / GPIO33
  # ----------------------------------------------------------
  - platform: template
    id: sct_2_raw_ac
    name: "BERO Mod2 SCT2 Notr 1T Raw AC"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 5
    force_update: true
    update_interval: never

  - platform: ct_clamp
    id: sct_2_current
    name: "BERO Mod2 SCT2 Notr 1T Akim"
    sensor: sct_2_voltage_source
    sample_duration: 200ms
    update_interval: never
    force_update: true
    on_raw_value:
      then:
        - sensor.template.publish:
            id: sct_2_raw_ac
            state: !lambda |-
              return x;
    filters:
      - multiply: 24.22
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  # ----------------------------------------------------------
  # SCT3 — FAZ 2 TUR / GPIO34
  # ----------------------------------------------------------
  - platform: template
    id: sct_3_raw_ac
    name: "BERO Mod2 SCT3 Faz 2T Raw AC"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 5
    force_update: true
    update_interval: never

  - platform: ct_clamp
    id: sct_3_current
    name: "BERO Mod2 SCT3 Faz 2T Akim"
    sensor: sct_3_voltage_source
    sample_duration: 200ms
    update_interval: never
    force_update: true
    on_raw_value:
      then:
        - sensor.template.publish:
            id: sct_3_raw_ac
            state: !lambda |-
              return x;
    filters:
      - multiply: 24.22
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

script:
  - id: sct_sequential_reading
    mode: single
    then:
      - logger.log:
          level: INFO
          format: "BERO SEQUENCE: SCT1 FAZ 1T START"
      - component.update: sct_1_current
      - delay: 250ms

      - logger.log:
          level: INFO
          format: "BERO SEQUENCE: SCT1 COMPLETE / SCT2 NOTR 1T START"
      - component.update: sct_2_current
      - delay: 250ms

      - logger.log:
          level: INFO
          format: "BERO SEQUENCE: SCT2 COMPLETE / SCT3 FAZ 2T START"
      - component.update: sct_3_current
      - delay: 250ms

      - logger.log:
          level: INFO
          format: "BERO SEQUENCE: SCT3 COMPLETE / COMMON BIAS READ"
      - component.update: common_bias_adc_voltage

      - logger.log:
          level: INFO
          format: "BERO SEQUENCE: ALL CHANNELS COMPLETE"

interval:
  - interval: 2s
    then:
      - script.execute: sct_sequential_reading
