# E00A — açıklamalı deney yapılandırması
# HEDEF: Üç bağlantı/yük koşulunda ham ADC istatistiklerini karşılaştırmak.
# Bu dosya şimdilik plan belgesidir; firmware tarafından otomatik okunmaz.
# Ölçümden sonra gerçekleşen değerleri LOG/results.md içine yazın.

experiment:
  id: "E00A"
  title: "Ham SCT sinyali ve temel istatistikler"
  status: "planned" # planned | in_progress | measured | reviewed

hedef:
  soru: "SCT bağlantısı ve yük durumu ham ADC istatistiklerini nasıl değiştiriyor?"
  kabul:
    - "Üç koşulun her biri için ham örnek kaydı bulunması"
    - "Gerçek süre, örnek sayısı ve yaklaşık gerçek örnekleme hızının kaydı"
    - "Mean, min, max, peak-to-peak ve standart sapmanın karşılaştırılması"

donanim:
  kart: "ESP32 — tam kart modeli doğrulanacak"
  adc: "ESP32 dahili ADC"
  gpio: null # Ölçüm öncesinde kullanılan ADC GPIO doğrulanıp yazılacak.
  sensor: "SCT-013-030, 30A/1V"
  bias: "Mevcut 2 x 10 kOhm bölücü ve 100 nF; ADR-007 uyarınca ilk SCT bağlantılı koşuldan önce 10 uF paralel eklenmesi planlandı; fiziksel uygulama ölçüm öncesinde doğrulanacak"

ornekleme:
  hedef_hz: 2000 # Başlangıç hedefidir; doğrulanmış performans sonucu değildir.
  planlanan_kayit_s: 1 # Her koşul için yaklaşık 1 saniye.
  ham_veri_kaydet: true
  ham_veri_git'e_ekle: false # Ham örnekler varsayılan olarak yerel tutulur.

kosullar:
  - id: "A"
    ad: "bias_only"
    aciklama: "SCT jack bağlı değil; bias devresi ADC girişinde."
    yuk: "Yok"
  - id: "B"
    ad: "sct_yuksuz"
    aciklama: "SCT bağlı; ölçülen iletkenden akım geçmediği doğrulanır."
    yuk: "Akım yok"
  - id: "C"
    ad: "100w_akkor"
    aciklama: "SCT bağlı; 100 W akkor ampul açık."
    yuk: "100 W akkor ampul"

ciktilar:
  ham_ornekler: true
  istatistikler:
    - "mean"
    - "min"
    - "max"
    - "peak_to_peak"
    - "standard_deviation"
  metadata:
    - "hedef_ornekleme_hizi_hz"
    - "gercek_kayit_suresi_s"
    - "ornek_sayisi"
    - "yaklasik_gercek_ornekleme_hizi_hz"

log:
  gercek_kart_modeli: null
  gercek_gpio: null
  firmware_surumu_veya_commit: null
  kosul_kayitlari: []
  sapmalar_ve_gozlemler: []
  yapilmayan_islemler:
    - "Firmware geliştirme/derleme yapılmadı."
    - "Fiziksel ölçüm yapılmadı."

sonuc:
  durum: "Henüz ölçülmedi"
  yorum: null
  belirsizlikler: []
  sonraki_adim: "Kart ve ADC GPIO doğrulandıktan sonra ilk koşulun firmware/kayıt hazırlığını yapmak."
