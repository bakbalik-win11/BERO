# E00A — açıklamalı deney yapılandırması
# HEDEF: Bias trafosunun 3,3 V çıkışı ile Vmid noktasını ESP32 ADC üzerinden karşılaştırmak.
# Bu dosya plan belgesidir; firmware tarafından otomatik okunmaz.

experiment:
  id: "E00A"
  title: "Bias trafosu DC noktalarının ADC gözlemi"
  status: "planned"

hedef:
  soru: "Bias trafosunun regüle 3,3 V çıkışı ve yaklaşık 1,65 V Vmid noktası ADC'de nasıl okunuyor ve zaman içinde ne kadar değişiyor?"
  kabul:
    - "İki koşulun ham ADC kaydı bulunması"
    - "Her iki koşul için analogRead ve analogReadMilliVolts sonuçlarının kaydı"
    - "Multimetre DC değerleriyle karşılaştırma"
    - "Gerçek süre, örnek sayısı ve yaklaşık gerçekleşen örnekleme hızının kaydı"
    - "Mean, min, max, peak-to-peak ve standart sapmanın karşılaştırılması"
    - "Bilgisayarda ADC-değer/zaman grafiği"

donanim:
  kart: "ESP32-WROOM-32D adayı; gerçek kart ve pinout fiziksel olarak doğrulanacak"
  adc: "ESP32 dahili ADC1"
  gpio: 34 # Aday GPIO34 / ADC1_CH6; kart doğrulanmadan bağlanmayacak.
  sensor: "Yok; SCT bu deneyde bağlı değil."
  source: "Bias trafosu komple devre: RN130421, KBU6M, 2200uF/35V, L78L33 ve 2x10kOhm Vmid bölücüsü"
  common_ground: true

ornekleme:
  hedef_hz: 2000
  planlanan_kayit_s: 1
  ham_veri_kaydet: true
  ham_veri_git'e_ekle: false
  csv_sutunlari: "sample_index,adc_raw"
  yerel_dosya_yollari:
    - "data/raw/E00A/bias_trafo_3v3.csv"
    - "data/raw/E00A/bias_vmid.csv"

kosullar:
  - id: "A"
    ad: "bias_trafo_3v3"
    aciklama: "L78L33 nominal 3,3V DC çıkışı, harici 10k/10k ölçüm bölücüsü üzerinden ADC'ye uygulanır."
    adc_pin_voltaji: "Yaklaşık 1,65V"
    kaynak_gerilim_hesabi: "ADC pin mV x 2; direnç oranı doğrulanmalı"
  - id: "B"
    ad: "bias_vmid"
    aciklama: "Bias devresinin 2x10k bölücü orta noktası ADC'ye doğrudan uygulanır."
    adc_pin_voltaji: "Nominal yaklaşık 1,65V"

ciktilar:
  ham_ornekler: true
  adc_zaman_grafigi: true
  istatistikler:
    - "mean"
    - "min"
    - "max"
    - "peak_to_peak"
    - "standard_deviation"
  metadata:
    - "multimetre_dc_voltaji"
    - "hedef_ornekleme_hizi_hz"
    - "gercek_kayit_suresi_s"
    - "ornek_sayisi"
    - "yaklasik_gercek_ornekleme_hizi_hz"

log:
  gercek_kart_modeli: null
  gercek_gpio: null
  firmware_surumu_veya_commit: null
  kosul_kayitlari: []
  multimetre_olcumleri: []
  sapmalar_ve_gozlemler: []
  yapilmayan_islemler:
    - "Firmware geliştirme/derleme yapılmadı."
    - "Fiziksel bağlantı ve ölçüm yapılmadı."

sonuc:
  durum: "Henüz ölçülmedi"
  yorum: null
  belirsizlikler: []
  sonraki_adim: "Gerçek kart/pinout ve bias trafosu bulunduğunda bağlantı kontrolünü yapıp firmware hazırlamak."
