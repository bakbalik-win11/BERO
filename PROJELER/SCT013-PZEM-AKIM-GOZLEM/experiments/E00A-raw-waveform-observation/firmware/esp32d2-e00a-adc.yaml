# ============================================================
# BERO - E00A
# ESP32D2 - GPIO34 RAW / GPIO35 VOLTAJ SIFIR OFSETI
# ============================================================
#
# DENEY AMACI:
# Ayni Vmid noktasini iki ayri ADC kanaliyla gozlemek:
# GPIO34 ham ADC sayisi, GPIO35 voltaj tahmini.
#
# GPIO35 sifir noktasi duzeltmesi:
# Onceki GND gozleminde kararlı cikis 0.142 V idi.
# Bu surum bu gozlemi GECICI sifir ofseti olarak cikarir.
# Duzeltilmis cikti: max(0, ADC voltaji - 0.142 V)
#
# Bu, ADC donanimini kalibre etmez; yalnizca gozlenen sifir
# tabanini yazilimda sifirlar. Farkli gerilimlerde dogruluk
# ve dogrusallik kaniti degildir.
#
# ============================================================

esphome:
  name: esp32d2
  friendly_name: ESP32D2
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  # GPIO34 - ADC ham sayisi
  - platform: adc
    pin: GPIO34
    id: gpio34_adc_raw
    name: "ESP32D2 GPIO34 ADC Raw"
    attenuation: 12db
    raw: true
    accuracy_decimals: 0
    unit_of_measurement: "count"
    state_class: measurement
    samples: 1
    update_interval: 1s

  # GPIO35 - ADC voltaj tahmini, gecici sifir ofseti duzeltilmis
  - platform: adc
    pin: GPIO35
    id: gpio35_adc_voltage_corrected
    name: "ESP32D2 GPIO35 ADC Voltage Corrected"
    attenuation: 12db
    raw: false
    accuracy_decimals: 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    samples: 1
    update_interval: 1s
    filters:
      - lambda: |-
          // GND gozleminde gorulen 0.142 V tabanini cikar.
          // Negatif sonuc yerine 0 V yayinla.
          return (x > 0.142f) ? (x - 0.142f) : 0.0f;
