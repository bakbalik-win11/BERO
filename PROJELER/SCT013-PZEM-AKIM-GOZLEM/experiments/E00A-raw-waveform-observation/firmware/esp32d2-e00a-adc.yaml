# ============================================================
# BERO - E00A
# ESP32D2 - GPIO35 ADC HAM SAYIM GÖZLEMİ
# ============================================================
#
# DENEY AMACI:
# ADC voltaj kalibrasyonu/dönüşümü olmadan GPIO35 ham ADC sayısını
# gözlemek. Bu sürümde volt cinsinden sonuç üretilmez.
#
# DONANIM:
# Klasik ESP32 / ESP32-WROOM-32D sınıfı
# GPIO35 : ADC1_CH7
#
# BAĞLANTI:
# GPIO35 -> test edilen bias/Vmid düğümü
# ESP32 GND -> bias devresi GND
#
# GPIO34 bu deneyde kullanılmıyor; bağlı olmadığı için sensör
# tanımından çıkarıldı.
#
# ÖNEMLİ:
# raw: true, ADC voltaj kalibrasyonunu/volt cinsine dönüşümü
# kullanmadan ham sayım çıktısı verir.
# Bu ayar ADC ofsetini düzeltmez ve elektriksel sorunu çözmez.
# Ham taban değeri gözlendikten sonra ayrı bir sıfır noktası
# düzeltmesi değerlendirilir.
#
# ============================================================

esphome:
  name: esp32d2
  friendly_name: ESP32D2
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: adc
    pin: GPIO35
    id: gpio35_adc_raw
    name: "ESP32D2 GPIO35 ADC Raw"
    attenuation: 12db
    raw: true
    accuracy_decimals: 0
    unit_of_measurement: "count"
    state_class: measurement
    samples: 1
    update_interval: 1s
