# ============================================================
# BERO - E00A / ADIM 2 REVIZYONU
# ESP32D2 - GPIO34 HAM ADC / GPIO35 DUZELTME UYGULANMAMIS VOLTAJ
# ============================================================
#
# DENEY AMACI:
# Bias devresinin DC seviyesini ESP32 dahili ADC ile oldugu gibi gozlemlemek.
# ADC voltajina yazilimsal sifir ofseti uygulanmaz.
#
# BU REVIZYONDA:
# - GPIO34 ham ADC sayisini (count) yayinlar.
# - GPIO35 ADC voltaj tahminini hicbir ofset cikarmadan yayinlar.
# - Onceki 0.142 V yazilimsal sifir filtresi kaldirilmistir.
#
# ONCEKI DENEMEDEN CIKAN DERS:
# GND testinde GPIO35 kararlı bolumde 0.142 V gostermisti. Bu tek
# gozlem gercek bir ADC sifir-ofseti oldugunu kanitlamiyordu.
# 0.142 V degerini yazilimdan cikarmak GND kosulunda ekrani 0.000 V
# yapti; ancak bias Vmid testinde gercek DC voltaji da ayni miktarda
# dusurdu. Kullanici multimetrede Vmid'i 1.654 V civarinda bildirdi.
# Logdaki duzeltilmis ortalama yaklasik 1.525 V; ofset geri eklendiginde
# filtresiz voltaj tahmini yaklasik 1.667 V olur. Fark yaklasik 13 mV.
# Bu nedenle sifirlama gercek DC seviyeyi gizledi ve dogru okumayi bozdu.
#
# KARAR:
# Sabit 0.142 V yazilimsal duzeltme kullanilmayacak. ADC voltaj tahmini
# oldugu gibi yayinlanacak. GND'de 0.142 V gorulmesi de veri olarak
# korunacak; otomatik sifirlanmayacak. Farkli DC noktalarinda test
# yapilmadan ADC genel kalibrasyonu iddia edilmeyecek.
#
# DONANIM:
# Klasik ESP32-WROOM-32D / ESP32
# GPIO34 = ADC1_CH6
# GPIO35 = ADC1_CH7
#
# BAGLANTI:
# Bu deney adiminda GPIO35'in test edilen DC noktasi baglantisi
# ve ESP32 GND ortakligi fiziksel olarak korunmalidir.
# GPIO34 yalniz gercekten bagliysa ham ADC verisi anlamlidir.
# GPIO34 bagli degilse giris floating kalabilir; degeri yorumlama.
#
# BEKLENTI:
# GPIO35 voltajini duzeltmesiz yayinlamak; GND'de gorulen sifir disi degeri de kaydetmek.
# Bu sonuc yeni cihaz loguyla dogrulanmadan basarili sayilmaz.
#
# GUVENLIK:
# 3.31 V cikisini GPIO34 veya GPIO35'e dogrudan baglama.
# ADC girisine GND altinda veya kartin izin verilen giris araligi
# disinda gerilim uygulama. Baglantilari enerji kesikken degistir.
#
# OKUMA:
# Home Assistant'a her 1 saniyede bir sensor durumu yayinlanir.
# Bu ayar yuksek hizli ornekleme veya 30 saniyelik CSV kaydi degildir.
#
# ============================================================

esphome:
  name: esp32d2
  friendly_name: ESP32D2
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ============================================================
# ADC SENSORLERI
# ============================================================
sensor:
  # ----------------------------------------------------------
  # GPIO34 - HAM ADC SAYISI
  # ----------------------------------------------------------
  # raw: true oldugu icin voltaja donusturulmus deger degil,
  # ESPHome ADC bileseninin ham count degeri yayinlanir.
  # Bu kanal GPIO35 ile ayni ADC ornegi degildir; ayri GPIO'dur.
  - platform: adc
    pin: GPIO34
    id: gpio34_adc_raw
    name: "ESP32D2 GPIO34 ADC Raw"
    attenuation: 12db
    raw: true
    accuracy_decimals: 0
    unit_of_measurement: "count"
    state_class: measurement
    samples: 1
    update_interval: 1s

  # ----------------------------------------------------------
  # GPIO35 - DUZELTME UYGULANMAMIS ADC VOLTAJ
  # ----------------------------------------------------------
  # raw: false -> ADC voltaj tahmini Volt cinsinden uretilir.
  # Yazilimsal ofset veya alt sinir filtresi uygulanmaz.
  - platform: adc
    pin: GPIO35
    id: gpio35_adc_voltage
    name: "ESP32D2 GPIO35 ADC Voltage Uncorrected"
    attenuation: 12db
    raw: false
    accuracy_decimals: 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    samples: 1
    update_interval: 1s
# ============================================================
# DENEY KAYIT NOTLARI
# ============================================================
#
# HEDEF:
# GPIO35 ADC voltajini hicbir yazilimsal sifir duzeltmesi yapmadan
# yayinlamak ve multimetreyle karsilastirmak.
#
# LOG:
# Onceki GND logunda 0.142 V gozlenmistir. 0.142 V ofsetli deneme
# GND'de 0.000 V vermis, ancak bias acikken gercek DC seviyeyi ayni
# miktarda dusurmustur. Bu nedenle duzeltme kaldirildi.
#
# SONUC:
# ADC voltaj tahmini oldugu gibi korunur. GND'deki 0.142 V saklanmaz
# veya otomatik silinmez. Farkli DC noktalariyla karsilastirma yapilir;
# tek nokta ADC genel dogrulugunu kanitlamaz.
#
# ============================================================
