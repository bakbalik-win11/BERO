# ============================================================
# BERO - E00B FIRMWARE / E08 ASAMA 2'DE GOZLEM AMACLI KULLANIM
# ESP32D2 / ESP-IDF - MEVCUT DORT KANALLI ADC GOSTERIMI
# ============================================================
#
# DOSYA KIMLIGI VE KAPSAM:
# Bu dosya E00B icin hazirlanmis mevcut ESP32D2 firmware'idir.
# E08 Asama 2 / 100 W akkor yuk gozleminde, kullanicinin karariyla
# yeni firmware olusturmadan aynen kullanilacaktir.
# E08 kullanimi dosyanin E00B kimligini veya ESP32D2 cihaz kimligini
# degistirmez. Bu aciklama, firmware'in deneydeki kullanim amacini
# belirtir; yeni bir cihaz/firmware tanimi olusturmaz.
#
# E08 ASAMA 2 GOZLEM AMACI:
# 100 W akkor yuk devredeyken mevcut bias ve SCT ADC alanlarinin
# 1 saniyelik Home Assistant yayinlari boyunca nasil davrandigini
# gozlemek; yuk altindaki degerleri onceki E00B akimsiz gozlem
# kaydiyla karsilastirmaya uygun sekilde kaydetmek.
#
# ONEMLI KAPSAM SINIRI:
# Bu firmware yuksek hizli ham ADC edinimi yapmaz.
# 1 kS/s, 2 kS/s veya 2.5 kS/s hedeflerini uygulamaz.
# 200 ms pencere, RMS, Peak veya Peak-to-Peak hesaplamaz.
# Her ADC sensoru mevcut ayarinda 1 saniyede bir yayinlanir.
# Bu nedenle E08 Asama 2'nin bu ilk adimi dusuk hizli alan
# gozlemidir; yuksek hizli ornekleme matrisi sonraki ayri asamadir.
#
# GOZLENECEK ALANLAR:
# Bias referansi: GPIO34 RAW count ve GPIO35 ADC voltaj tahmini.
# SCT dugumu: GPIO32 RAW count ve GPIO33 ADC voltaj tahmini.
# Template sensorleri nominal voltaj tahminlerini ve ilgili farklari
# gosterir; bunlar kalibre edilmis olcum degildir.
#
# DENEY PLANI / KOD ILISKISI:
# E08 Asama 2 protokolu: ../E08-sct-characterization/stage-02-100w-matrix.md
# Bu firmware experiment.yaml dosyasini otomatik okumaz.
# Buradaki ayarlar firmware icinde sabittir; E08 protokolu yalnizca
# gozlemin amacini ve kayit kosullarini aciklar.
#
# DONANIM / BAGLANTILAR:
# GPIO34 / ADC1_CH6 = Bias Vmid RAW count
# GPIO35 / ADC1_CH7 = Bias Vmid ADC voltaj tahmini
# GPIO32 / ADC1_CH4 = SCT bias uygulanmis analog dugum RAW count
# GPIO33 / ADC1_CH5 = Ayni SCT analog dugumunun ADC voltaj tahmini
# ESP32 GND ile bias devresi GND ortak olmalidir.
# GPIO32 ve GPIO33 ayni analog dugumu iki ayri ADC kanaliyla gozler;
# ayni anda alinmis tek bir ADC ornegi olarak yorumlanmamali.
#
# ONEMLI PIN NOTU:
# GPIO32/33, mevcut ESP32D2 firmware'inde tanimli ADC1 pinleridir.
# Fiziksel baglanti oncesinde kullanilan gelistirme kartinin pinout'u
# dogrulanmis olmalidir. Bu aciklama pin veya kart degisikligi talep etmez.
#
# RAW VOLTAJ TAHMINI:
# count * 3.1 / 4095 nominal gosterimdir; kalibrasyon degildir.
# Yazilimsal 0.142 V offset uygulanmaz. E00A'da sabit offsetin
# gercek Vmid DC degerini bozdugu goruldu.
#
# OKUMA / YAYIN:
# Her sensor 1 saniyede bir Home Assistant/ESPHome'a yayin yapar.
# Sensorlerin ayri update donguleri eszamanli ADC ornekleme garantisi
# vermez. Bu ciktilar hizli dalga formu veya ham pencere verisi degildir.
#
# GUVENLIK:
# Baglantilari enerji kesikken yap. SCT sekonderini primer akimi
# varken uretici izin vermedikce acik devre birakma.
# Sebeke iletkeni uzerinde calisma yalniz yetkin kisi tarafindan,
# uygun izolasyon ve muhafaza ile yapilmalidir.
# ============================================================
esphome:
  name: esp32d2
  friendly_name: BERO E00B ESP32D2
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  # ----------------------------------------------------------
  # BIAS REFERANSI - GPIO34 RAW
  # ----------------------------------------------------------
  - platform: adc
    pin: GPIO34
    id: bias_adc_raw
    name: "BERO E00B Bias GPIO34 RAW"
    attenuation: 12db
    raw: true
    accuracy_decimals: 0
    unit_of_measurement: "count"
    state_class: measurement
    samples: 1
    update_interval: 1s

  # GPIO34 RAW count degerinin nominal voltaj karsiligi.
  - platform: template
    id: bias_raw_voltage_estimate
    name: "BERO E00B Bias GPIO34 RAW Voltage Estimate"
    lambda: |-
      if (isnan(id(bias_adc_raw).state)) {
        return {};
      }
      return id(bias_adc_raw).state * (3.1f / 4095.0f);
    accuracy_decimals: 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    update_interval: 1s

  # Bias Vmid noktasinin ESPHome ADC voltaj tahmini; offset yok.
  - platform: adc
    pin: GPIO35
    id: bias_adc_voltage
    name: "BERO E00B Bias GPIO35 ADC Voltage"
    attenuation: 12db
    raw: false
    accuracy_decimals: 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    samples: 1
    update_interval: 1s

  # GPIO35 ADC voltaji - GPIO34 RAW nominal voltaj tahmini.
  - platform: template
    id: bias_voltage_difference
    name: "BERO E00B Bias Voltage Difference GPIO35 minus GPIO34"
    lambda: |-
      if (isnan(id(bias_raw_voltage_estimate).state) ||
          isnan(id(bias_adc_voltage).state)) {
        return {};
      }
      return id(bias_adc_voltage).state -
             id(bias_raw_voltage_estimate).state;
    accuracy_decimals: 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    update_interval: 1s

  # ----------------------------------------------------------
  # SCT DUGUMU - GPIO32 RAW
  # ----------------------------------------------------------
  - platform: adc
    pin: GPIO32
    id: sct_adc_raw
    name: "BERO E00B SCT GPIO32 RAW"
    attenuation: 12db
    raw: true
    accuracy_decimals: 0
    unit_of_measurement: "count"
    state_class: measurement
    samples: 1
    update_interval: 1s

  # GPIO32 RAW count degerinin nominal voltaj karsiligi.
  - platform: template
    id: sct_raw_voltage_estimate
    name: "BERO E00B SCT GPIO32 RAW Voltage Estimate"
    lambda: |-
      if (isnan(id(sct_adc_raw).state)) {
        return {};
      }
      return id(sct_adc_raw).state * (3.1f / 4095.0f);
    accuracy_decimals: 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    update_interval: 1s

  # SCT'nin bias uygulanmis analog dugumunun ADC voltaj tahmini.
  - platform: adc
    pin: GPIO33
    id: sct_adc_voltage
    name: "BERO E00B SCT GPIO33 ADC Voltage"
    attenuation: 12db
    raw: false
    accuracy_decimals: 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    samples: 1
    update_interval: 1s

  # GPIO33 ADC voltaji - GPIO32 RAW nominal voltaj tahmini.
  - platform: template
    id: sct_voltage_difference
    name: "BERO E00B SCT Voltage Difference GPIO33 minus GPIO32"
    lambda: |-
      if (isnan(id(sct_raw_voltage_estimate).state) ||
          isnan(id(sct_adc_voltage).state)) {
        return {};
      }
      return id(sct_adc_voltage).state -
             id(sct_raw_voltage_estimate).state;
    accuracy_decimals: 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    update_interval: 1s

# ============================================================
# E00B FIRMWARE KAYDI / E08 ASAMA 2 KULLANIM NOTU
# ============================================================
# HEDEF:
# E00B'nin asli hedefi, SCT bagliyken primer akimi yok kosulunda
# GPIO34/35 bias referansini ve GPIO32/33 SCT dugumunu gozlemekti.
# E08 Asama 2'de ayni mevcut firmware, 100 W akkor yuk altindaki
# dusuk hizli sensor alanlarini gozlemlemek icin degistirilmeden kullanilir.
#
# LOG:
# Bu firmware'in daha once derlendigi kullanici tarafindan bildirildi.
# Bu bildirim E00B derleme kaydidir; E08 100 W fiziksel testinin
# yapildigi veya yeni bir derleme/flash islemi gerceklestigi anlamina gelmez.
# E08 100 W yuk gozlemi icin fiziksel LOG henuz olusturulmamistir.
#
# SONUC:
# Bu dosya E08 icin yuksek hizli edinim saglamaz; yalniz mevcut
# 1 saniyelik sensor yayinlariyla dusuk hizli gozlem saglar.
# 100 W yuk altindaki gercek davranis, fiziksel test ve log alindiktan
# sonra degerlendirilecektir. Su an E08 sonucu henuz olculmemistir.
# ============================================================