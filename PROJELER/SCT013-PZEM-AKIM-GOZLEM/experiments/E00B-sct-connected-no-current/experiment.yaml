# E00B deney plani. ESPHome firmware bu dosyayi otomatik okumaz.
experiment:
  id: "E00B"
  title: "SCT bagliyken akimsiz hat ADC gozlemi"
  status: "DEVICE_LOG_CAPTURED"
  firmware: "firmware/esp32d2-e00b-sct-no-current.yaml"
  firmware_compile:
    status: "SUCCESS_USER_REPORTED"
    date: "2026-10-30"
    evidence: "2026-10-30 cihaz logunda ESPHome 2026.9.1 firmware build bilgisi ve API bağlantısı görüldü."

hedef:
  neden: "E00A SCT'siz bias-only tabanina gore SCT baglandiginda ADC dugumunun davranisini gozlemek."
  soru: "SCT analog dugumu primer akimi yokken bias ve dalgalanmayi nasil etkiliyor?"
  kabul:
    - "SCT bagli ve izlenen iletkende primer akimi olmadigi dogrulansin."
    - "Bias GPIO34 RAW ve GPIO35 voltaj logu alinsin."
    - "SCT GPIO32 RAW ve GPIO33 voltaj logu alinsin."
    - "Zaman damgalari korunsun; baslangic RAW sifirlari kullanici kuralina gore eslestirmeye alinmasin."
    - "Kanal istatistikleri ve E00A bias-only tabaniyla fark raporlansin."

donanim:
  kart:
    planned: "ESP32-WROOM-32D tabanli klasik ESP32"
    actual: null # Gercek kart modeli/etiketleri bu kayitta kullanici tarafindan teyit edilmedi.
  sensor: "SCT013-030, 30 A / 1 V"
  adc: "ESP32 dahili ADC1; MCP3208 bu adimda kullanilmiyor."
  bias_devresi: "2x10k Vmid bolucu; mevcut 100nF ve 10uF ekleme planinin fiziksel durumu ayrica kaydedilmeli."
  common_ground: true # ESP32 ve bias devresi GND ortak olmali.

gpio_plan:
  bias_raw: {gpio: 34, adc_channel: "ADC1_CH6", purpose: "Bias Vmid RAW count"}
  bias_voltage: {gpio: 35, adc_channel: "ADC1_CH7", purpose: "Bias Vmid ADC voltaj tahmini"}
  sct_raw: {gpio: 32, adc_channel: "ADC1_CH4", purpose: "SCT analog dugumu RAW count"}
  sct_voltage: {gpio: 33, adc_channel: "ADC1_CH5", purpose: "Ayni SCT analog dugumunun ADC voltaj tahmini"}
  pinout_status: "GPIO32/33 planlanan pinlerdir; gercek kart pinout fiziksel dogrulamasi henuz kaydedilmedi."

connections:
  - "GPIO34 ve GPIO35 bias Vmid noktasini ayri ADC kanallarinda gozler."
  - "GPIO32 ve GPIO33 SCT'nin bias uygulanmis analog dugumunu ayri ADC kanallarinda gozler."
  - "ESP32 GND ile bias GND ortak olmalidir."
  - "Ayni dugumu okuyan iki ADC kanali eszamanli tek ornek kabul edilmez."

conditions:
  - id: "A"
    name: "SCT_connected_no_primary_current"
    sct_connected: true
    primary_current: 0
    load: "Kapali/enerjisiz"
    firmware_compile: "Kullanici basarili derleme bildirdi."
    firmware_uploaded: true # ESPHome API üzerinden çalışan cihaza bağlanıldı.
    physical_test_done: true # Kullanıcı cihaz logu sağladı; primer akım=0 ve fiziksel bağlantı koşulu log satırlarıyla bağımsız doğrulanmış değil.

sampling:
  actual_update_interval: "1s"
  note: "ESPHome sensor yayin araligi 1 saniyedir; bu yuksek hizli ham ADC orneklemesi degildir."
  target_rates_sps: [1000, 2000, 2500]
  target_rates_note: "E08 hedefleridir; E00B firmware'inde uygulanmamistir."
  raw_capture: "Kisa deney kesiti; surekli ham arsiv yok."

outputs:
  - "GPIO34 RAW ve GPIO35 bias voltaj zaman serileri"
  - "GPIO32 RAW ve GPIO33 SCT voltaj zaman serileri"
  - "Ornek sayisi, gercek sure ve gerceklesen yayin araligi"
  - "Mean, min, max, peak-to-peak, standard deviation"
  - "E00A SCT'siz bias-only tabanina gore fark"

log:
  source_file: "logs/2026-10-30-e00b-esp32d2-startup-and-observation.log"
  firmware_commit: "20fbe9b4a99d057ef579d882bfd83d23f4ef199e"
  actual_board: "ESP32 rev3.1, 2 core (logda bildirildi)"
  actual_gpio_verified: true # Çalışan cihaz logunda GPIO34/35/32/33 ADC1 pinleri doğrulandı.
  physical_connection_verified: false # Log ADC çalışmasını doğrular; kablo/CT montajını bağımsız doğrulamaz.
  records:
    - date: "2026-10-30"
      source: "logs/2026-10-30-e00b-esp32d2-startup-and-observation.log"
      type: "ESPHome device log"
      valid_window: "16:20:41 sonrası, 110 örnek/kanal"
      startup_excluded: "İlk yaklaşık 9 saniye; RAW 0 count ve ADC 0.142 V başlangıç geçişi"
      bias_gpio34_raw_mean_count: 1854.14
      sct_gpio32_raw_mean_count: 1853.45
      bias_gpio35_voltage_mean_v: 1.6651
      sct_gpio33_voltage_mean_v: 1.6639
      interpretation: "Kararlı bölümde bias ve SCT ADC kanalları birbirine yakın; ilk açılış değerleri hariç tutuldu."

result:
  status: "CIHAZ_LOGU_ALINDI; FIZIKSEL_KOSULLARIN_TAM_DOGRULAMASI_BEKLIYOR"
  conclusion: "ESPHome cihaz logu alindi; dort ADC kanali baslatildi ve kararlı pencerede olcumler goruldu. Primer akimin sifir oldugu ve fiziksel SCT baglantisi logdan tek basina dogrulanamaz."
  next_step: "Fiziksel SCT montajini ve primer akimin sifir oldugu kosulu kaydet; daha uzun kararlı kayit al ve acilis gecisini disla."
