# ============================================================
# BERO MODUL 2 — ESP32D1
# UC SCT KANALI — SIRALI CT_CLAMP OKUMASI
# ESPHome 2026.10.1
# ============================================================
#
# AMAC:
# - Aynı 100 W akkor ampul yükünü üç SCT sensörüyle izlemek.
# - SCT-1, SCT-2 ve SCT-3 ölçüm pencerelerini sırayla çalıştırmak.
# - Bir SCT ölçüm yaparken diğer SCT kanallarını bekletmek.
# - Üç kanalı aynı ölçüm çevriminde karşılaştırılabilir hale getirmek.
# - Ortak bias noktasını GPIO35 üzerinden izlemek.
#
# DONANIM BAGLANTILARI:
# - SCT-1 sarı sinyal  -> GPIO32 / ADC1_CH4
# - SCT-2 yeşil sinyal -> GPIO33 / ADC1_CH5
# - SCT-3 mavi sinyal  -> GPIO34 / ADC1_CH6
# - Ortak bias turuncu -> GPIO35 / ADC1_CH7
#
# Bias:
# - Tek ortak bias devresi ve tek ortak bias hattı kullanılır.
# - Üç SCT sinyal yolu birbirinden bağımsızdır.
#
# OKUMA SIRASI:
# 1. SCT-1 başlatılır, 200 ms ölçüm yapılır.
# 2. 50 ms bekleme payı bırakılır.
# 3. SCT-2 başlatılır, 200 ms ölçüm yapılır.
# 4. 50 ms bekleme payı bırakılır.
# 5. SCT-3 başlatılır, 200 ms ölçüm yapılır.
# 6. 50 ms bekleme payı bırakılır.
# 7. GPIO35 ortak bias bir kez okunur.
#
# ZAMANLAMA:
# - Her ct_clamp sample_duration: 200ms
# - Her kanal sonrası bekleme: 50ms
# - Üç SCT toplam pencere çevrimi: yaklaşık 750ms
# - Yeni çevrim başlangıcı: 2 saniyede bir
#
# TEKNIK UYGULAMA:
# - ADC kaynaklarının otomatik yayın/güncellemesi kapalıdır.
# - ct_clamp bileşenlerinin otomatik zamanlayıcısı kapalıdır.
# - Ölçümler component.update ile elle başlatılır.
# - Tek bir script sıralamayı yönetir.
# - Script mode: single, ikinci çevrimin ilk çevrim
#   tamamlanmadan başlamasını engeller.
# - ADC kaynakları ct_clamp tarafından doğrudan okunur.
# - Bias ADC okuması üç SCT ölçümü bittikten sonra yapılır.
#
# KATSAYI:
# - Üç kanalda da başlangıç katsayısı 24.22 kullanılır.
# - Bu test katsayı kalibrasyonu değildir.
# - Kanalların Raw AC değerleri ayrıca yayımlanır.
#
# BEKLENEN ENTITY'LER:
# - BERO Mod2 SCT1 Raw AC
# - BERO Mod2 SCT1 Akim
# - BERO Mod2 SCT2 Raw AC
# - BERO Mod2 SCT2 Akim
# - BERO Mod2 SCT3 Raw AC
# - BERO Mod2 SCT3 Akim
# - ESP32D1 Common Bias ADC Voltage
#
# TEST BEKLENTISI:
# - Aynı 100 W ampul üç SCT tarafından aynı testte izlenir.
# - Her ölçüm penceresinde yalnızca bir ct_clamp aktiftir.
# - Üç kanalın ölçüm sonuçları ayrı ayrı yayımlanır.
# - Kanal sırası loglardan takip edilebilir.
#
# GUVENLIK:
# - SCT yalnızca tek yalıtılmış faz iletkenini kavrar.
# - Faz ve nötr aynı SCT içinden birlikte geçirilmez.
# - SCT bağlantısı değiştirilirken yük enerjisiz olmalıdır.
# - Şebeke bağlantıları kapalı ve korumalı düzende tutulmalıdır.
# ============================================================

esphome:
  name: esp32d1
  friendly_name: ESP32D1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:

  # SCT-1 ADC kaynağı — GPIO32
  - platform: adc
    id: sct_1_voltage_source
    name: "ESP32D1 SCT1 ADC Source"
    pin: GPIO32
    attenuation: 12db
    raw: false
    samples: 1
    internal: true
    update_interval: never

  # SCT-2 ADC kaynağı — GPIO33
  - platform: adc
    id: sct_2_voltage_source
    name: "ESP32D1 SCT2 ADC Source"
    pin: GPIO33
    attenuation: 12db
    raw: false
    samples: 1
    internal: true
    update_interval: never

  # SCT-3 ADC kaynağı — GPIO34
  - platform: adc
    id: sct_3_voltage_source
    name: "ESP32D1 SCT3 ADC Source"
    pin: GPIO34
    attenuation: 12db
    raw: false
    samples: 1
    internal: true
    update_interval: never

  # Ortak bias — GPIO35; çevrim sonunda okunur.
  - platform: adc
    id: common_bias_adc_voltage
    name: "ESP32D1 Common Bias ADC Voltage"
    pin: GPIO35
    attenuation: 12db
    raw: false
    samples: 1
    accuracy_decimals: 5
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    force_update: true
    update_interval: never

  # SCT-1 Raw AC
  - platform: template
    id: sct_1_raw_ac
    name: "BERO Mod2 SCT1 Raw AC"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 5
    force_update: true
    update_interval: never

  # SCT-1 CT Clamp
  - platform: ct_clamp
    id: sct_1_current
    name: "BERO Mod2 SCT1 Akim"
    sensor: sct_1_voltage_source
    sample_duration: 200ms
    update_interval: never
    on_raw_value:
      then:
        - sensor.template.publish:
            id: sct_1_raw_ac
            state: !lambda |-
              return x;
    filters:
      - multiply: 24.22
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  # SCT-2 Raw AC
  - platform: template
    id: sct_2_raw_ac
    name: "BERO Mod2 SCT2 Raw AC"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 5
    force_update: true
    update_interval: never

  # SCT-2 CT Clamp
  - platform: ct_clamp
    id: sct_2_current
    name: "BERO Mod2 SCT2 Akim"
    sensor: sct_2_voltage_source
    sample_duration: 200ms
    update_interval: never
    on_raw_value:
      then:
        - sensor.template.publish:
            id: sct_2_raw_ac
            state: !lambda |-
              return x;
    filters:
      - multiply: 24.22
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  # SCT-3 Raw AC
  - platform: template
    id: sct_3_raw_ac
    name: "BERO Mod2 SCT3 Raw AC"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 5
    force_update: true
    update_interval: never

  # SCT-3 CT Clamp
  - platform: ct_clamp
    id: sct_3_current
    name: "BERO Mod2 SCT3 Akim"
    sensor: sct_3_voltage_source
    sample_duration: 200ms
    update_interval: never
    on_raw_value:
      then:
        - sensor.template.publish:
            id: sct_3_raw_ac
            state: !lambda |-
              return x;
    filters:
      - multiply: 24.22
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

script:
  - id: sct_sequential_reading
    mode: single
    then:
      - logger.log:
          level: INFO
          format: "BERO SEQUENCE: SCT1 START"
      - component.update: sct_1_current
      - delay: 250ms
      - logger.log:
          level: INFO
          format: "BERO SEQUENCE: SCT1 COMPLETE / SCT2 START"
      - component.update: sct_2_current
      - delay: 250ms
      - logger.log:
          level: INFO
          format: "BERO SEQUENCE: SCT2 COMPLETE / SCT3 START"
      - component.update: sct_3_current
      - delay: 250ms
      - logger.log:
          level: INFO
          format: "BERO SEQUENCE: SCT3 COMPLETE / BIAS READ"
      - component.update: common_bias_adc_voltage
      - logger.log:
          level: INFO
          format: "BERO SEQUENCE: ALL CHANNELS COMPLETE"

interval:
  - interval: 2s
    then:
      - script.execute: sct_sequential_reading
