# E00F-N03 — 100 W akkor yük basamak gözlemi
# Amaç: Mevcut E00F ölçüm zincirinin bilinen akkor yük açıldığında verdiği tepkiyi
# yüksüz başlangıç kesitiyle karşılaştırmak. Bu YAML kayıt/deney tanımıdır;
# ESPHome firmware'i tarafından otomatik okunmaz.

experiment:
  id: E00F-N03
  date: "2026-10-31"
  status: COMPLETED
  purpose: >
    100 W akkor ampulün açılmasıyla SCT013/ct_clamp Raw AC çıktısında oluşan
    seviye değişimini, firmware ve donanım ayarlarını değiştirmeden gözlemek.
    Bu adım kalibrasyon veya ±%4 doğruluk doğrulaması değildir.

hardware:
  device: esp32d2
  sensor: SCT013-030
  sensor_rating: "30 A / 1 V"
  load:
    type: incandescent
    rated_power_w: 100
    evidence: "KULLANICI BEYANI — kullanıcı 100 W akkor ampul olduğunu doğruladı."
  primary_conductor: phase # KULLANICI TEYİDİ — SCT içinden yalnız faz iletkeni geçiyor.
  primary_turns: 1 # KULLANICI TEYİDİ — faz iletkeni SCT içinden tek geçiş yapıyor.
  connections:
    sct_raw: "SCT analog düğümü -> GPIO32 (RAW ADC)"
    sct_voltage: "SCT analog düğümü -> GPIO33 (ADC voltaj)"
    bias_raw: "Bias referansı -> GPIO34 (RAW ADC)"
    bias_voltage: "Bias referansı -> GPIO35 (ADC voltaj)"
    common_ground: "Mevcut E00F bağlantısı; bu logda fiziksel kablolama bağımsız doğrulanmadı."
  adc:
    unit: ADC1
    attenuation: 12db
    samples: 1
    sampling_mode: average
    slow_channel_update_interval: 1s

firmware:
  device_identity: esp32d2
  esphome_version_observed: "2026.10.1"
  ct_clamp_sample_duration: 200ms
  ct_clamp_update_interval: 2s
  multiplier: 24.22 # Mevcut E00F ayarı; bu testte değiştirilmedi.
  adc_pins:
    sct_raw: GPIO32
    sct_voltage: GPIO33
    bias_raw: GPIO34
    bias_voltage: GPIO35
  changes_during_test: false

conditions:
  - id: pre_load
    load_state: OFF
    time_local: "10:30:27–10:31:59"
    note: "Logun açılma öncesinde kapsadığı başlangıç kesiti."
  - id: incandescent_on
    load_state: ON
    user_reported_start_local: "10:32"
    log_coverage_end_local: "10:39:25"
    note: "İkinci logda geçişten hemen önce 10:39:25.820 penceresi hâlâ 0.018 V."
  - id: return_to_preload_baseline
    load_state: OFF
    inferred_transition_local: "10:39:27.837–10:39:29.819"
    evidence: "LOGDAN ÇIKARIM — Raw AC 0.006 V'tan 0.000 V'a iner; kullanıcı ampulü 10:39’da kapattığını teyit etti."
    post_load_observation_end_local: "10:45:59.928"
    note: "10:40–10:46 aralığında Raw AC medyanı 0.000 V."

recording:
  source_files: ["esp32d2-logs (14).txt", "esp32d2-logs (15).txt"]
  source_sha256:
    first_log: "c4131d1d4a6f40f2024c05fa51eeed542cee4cf6b2d4a8f806d6a594ea72280e"
    second_log: "1ada9e16f102b8a290d2bdc3b8d7572c3ab442561f552acb081ee367f5a23952"
  ct_windows:
    first_log: 262
    second_log: 455
  slow_adc_updates_per_channel:
    first_log: 523
    second_log: "909 (GPIO32/33/35), 908 (GPIO34)"
  calibration_id: null # Bu gözlemde yeni kalibrasyon yapılmadı.
  raw_adc_archive: false # DEBUG logu ham ADC örnek dizisini içermez.

HEDEF:
  - "100 W akkor yük açıldığında Raw AC seviyesinin değişip değişmediğini gözlemek."
  - "Yük öncesi ve yük altındaki dağılımları karşılaştırmak."
  - "Kısa süreli yüksek sıçramaları kararlı yük seviyesiyle karıştırmamak."

LOG:
  user_reported_load_on_local: "10:32"
  log_start_local: "10:30:27.239"
  log_end_local: "10:45:59.928"
  ct_debug_window_count: 455
  user_reported_load_off_local: "10:39" # KULLANICI TEYİDİ
  inferred_raw_ac_return_local: "10:39:27.837–10:39:29.819"
  physical_ct_position_confirmed: true # Kullanıcı: tek geçiş, yalnız faz iletkeni.
  full_raw_log_committed_to_repository: false

SONUC:
  status: "TAMAMLANDI — E00F-N03 AÇ-KAPA GÖZLEMİ"
  interpretation: >
    Yük açılmadan önce Raw AC medyanı 0.004 V; açılma sonrası tüm kesitte
    0.019 V; 10:35–10:39 daha sakin bölümünde 0.019 V'tur. İkinci logda
    10:39:27.837–10:39:29.819 arasında değer 0.006 V'tan 0.000 V'a iner;
    10:40–10:46 medyanı 0.000 V'tur. Bu, yük kesildikten sonra sinyalin
    yüksüz başlangıç davranışına döndüğünü destekler. Kullanıcı ampulün 10:39’da kapatıldığını teyit etmiştir; logdaki dönüş bununla uyumludur.
  limitations:
    - "Kullanıcı fiziksel kapatma saatini 10:39 olarak teyit etti; logdaki 10:39:27–10:39:29 düşüşü bu beyanla uyumludur."
    - "CT bağlantısı kullanıcı tarafından doğrulandı: yalnız faz iletkeni, SCT içinden tek geçiş (1 tur). Bağımsız fiziksel inceleme yapılmadı."
    - "GPIO32/33/34/35 yavaş ADC okumaları CT pencereleriyle eşzamanlı değildir."
    - "N ve SPS bağımsız metrik değildir; SPS = N / 0.20 s."
    - "Kısa süreli yüksek değerlerin fiziksel nedeni bu logdan belirlenemez."
    - "PZEM referans verisi bulunmadığından kalibrasyon/±%4 doğruluk sonucu çıkarılamaz; bu, E00F-N03 gözlem testinin kabul koşulu değildir."
