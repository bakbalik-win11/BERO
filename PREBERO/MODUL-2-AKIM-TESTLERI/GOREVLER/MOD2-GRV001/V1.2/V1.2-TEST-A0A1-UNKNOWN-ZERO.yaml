# ============================================================
# BERO – MOD2-GRV001 – ct_clamp UNKNOWN -> ZERO DENEYİ
# ESP32D2 / ADS1115 No.10 / SCT013 30A-1V
# Sürüm: V1.2-TEST-A0A1-UNKNOWN-ZERO
# ============================================================
#
# AMAÇ:
# V1.1 ölçüm zincirini koruyarak ct_clamp çıktısı NaN/unknown
# olduğunda ESP32 çalışır durumdayken Home Assistant'a 0.000 A
# yayınlanmasını denemek.
#
# TASARIM MANTIĞI:
# - ct_clamp RMS + K=27.59 + 5 mA alt eşik hesabını yapar.
# - ct_clamp sensörü internal olduğu için doğrudan HA'ya sunulmaz.
# - Şablon sensörü her 1 saniyede ct_clamp durumunu kontrol eder.
# - ct_clamp durumu NaN ise 0.000 A yayınlar.
# - Geçerli sayı varsa ölçülen akımı aynen yayınlar.
# - ESP32 kapanır/ağdan koparsa ESPHome API bağlantısı kesilir;
#   HA entity'sinin unavailable olması beklenir.
#
# ÖNEMLİ SINIR:
# Bu sürüm NaN'ın nedenini ayırmaz. ESP32 açıkken ADS1115/I2C
# kaynaklı NaN da 0.000 A'ya dönüşebilir. Bu, kullanıcının bu
# deney için seçtiği işletim davranışıdır; ADC arızasını ayrıca
# teşhis eden bir sensör değildir.
#
# DONANIM / BAĞLANTILAR:
# ESP32D2 GPIO21 -> ADS1115 SDA
# ESP32D2 GPIO22 -> ADS1115 SCL
# ESP32D2 3.3V   -> ADS1115 VDD
# ESP32D2 GND    -> ADS1115 GND
# ADS1115 ADDR   -> GND (I2C 0x48)
# SCT013        -> ADS1115 A0-A1 (diferansiyel)
# Fiziksel bağlantı V1.1 ile aynı tutulur; bias eklenmez.
#
# ÖLÇÜM AYARLARI:
# ADS1115 modu       : Continuous
# Multiplexer        : A0_A1
# PGA                : 2.048 V
# Sample rate        : 860 SPS
# ct_clamp penceresi : 200 ms
# ct_clamp güncelleme: 1 saniye
# HA şablon güncelleme: 1 saniye
# Kalibrasyon K      : 27.59 (değiştirilmedi)
# Alt eşik           : 0.005 A
#
# BEKLENEN ÇIKTI:
# Home Assistant entity: BERO Akim Sensoru
# ESP açık + yüksüz / ct_clamp NaN -> 0.000 A
# ESP açık + yük var                 -> ölçülen akım
# ESP kapalı / API bağlantısı yok    -> unavailable beklenir
#
# TEST:
# 1. Yüksüz durumda gece boyunca 0.000 A sürekliliğini izle.
# 2. Kısa kontrollü yük ver; akım değerinin yükseldiğini doğrula.
# 3. ESP32'yi kapat; HA entity'sinin unavailable olduğunu doğrula.
# 4. ESP32'yi aç; sensörün yeniden 0.000 A / akım yayınlamasını izle.
# 5. ESPHome DEBUG logunu ve HA geçmişini birlikte sakla.
#
# GÜVENLİK:
# ADS1115 A0 ve A1 pinlerinin her biri GND'ye göre
# GND-0.3 V ile VDD+0.3 V sınırları içinde kalmalıdır.
# SCT yalnızca yalıtılmış tek iletkeni kavramalıdır.
# ESP32 GND şebekeye bağlanmamalıdır.
#
# DURUM:
# Kullanıcı bildirimi ve ESPHome OTA loguyla V1.2 derleme/çalışması doğrulandı.
# Yüksüz -> yük -> yeniden yüksüz akışı: 0.000 A -> 0.604/0.602/0.600 A -> 0.000 A.
# Bu test işlevsel sıfır/akım geçişini doğrular; PZEM karşılaştırması ve mutlak kalibrasyon doğrulaması değildir.
# Kısa ESP32 güç kesintisi testinde HA unavailable yaklaşık 71 ms görüldü; uzun offline davranışı ayrıca doğrulanmış sayılmaz.
# Ayrıntılı log ve yorum V1.2/LOG ile V1.2/RAPOR altındadır. V1.1 dosyasına dokunulmamıştır.
# ============================================================

esphome:
  name: esp32d2
  friendly_name: ESP32D2
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 400kHz

ads1115:
  - address: 0x48
    continuous_mode: true

sensor:
  # ADS1115 A0-A1 ham diferansiyel okuma
  - platform: ads1115
    multiplexer: A0_A1
    gain: 2.048
    sample_rate: 860
    id: ads_sct_a0_a1_raw
    internal: true

  # İç ölçüm sensörü: RMS, kalibrasyon ve 5 mA alt eşik.
  # NaN durumu aşağıdaki HA yayın sensöründe sıfıra çevrilir.
  - platform: ct_clamp
    sensor: ads_sct_a0_a1_raw
    id: bero_akim_a0_a1_internal
    internal: true
    sample_duration: 200ms
    update_interval: 1s
    accuracy_decimals: 3
    filters:
      - calibrate_linear:
          - 0.0 -> 0.0
          - 1.0 -> 27.59
      - lambda: |-
          if (x < 0.005) return 0.0;
          return x;

  # Home Assistant'a yayınlanan sensör.
  # ESP32 çalışırken ct_clamp NaN ise 0.000 A yayınlar.
  - platform: template
    name: "BERO Akim Sensoru"
    id: bero_akim_yayin
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    lambda: |-
      const float current = id(bero_akim_a0_a1_internal).state;
      if (isnan(current)) {
        return 0.0f;
      }
      return current;
