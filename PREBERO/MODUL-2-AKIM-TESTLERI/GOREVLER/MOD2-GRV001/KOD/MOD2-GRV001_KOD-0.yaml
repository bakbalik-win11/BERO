# ============================================================
# BERO – ESP32D2 / ADS1115 / SCT013
# KOD 0 – Yalnızca akım okuma
# ============================================================
#
# AMAÇ:
# SCT013 30A/1V sensöründen gelen AC sinyali ADS1115
# üzerinden okuyarak ct_clamp ile RMS akım değerini
# hesaplamak ve Home Assistant'a aktarmak.
#
# BU SÜRÜMDE:
# - Yalnızca tek SCT akım kanalı okunur.
# - ADS1115 A0-A1 diferansiyel giriş kullanılır.
# - ct_clamp ile 200 ms RMS ölçüm penceresi uygulanır.
# - Akım değeri Home Assistant'a 1 saniyede bir aktarılır.
#
# KALDIRILAN İŞLEVLER:
# - UDP port 4210 dinleyicisi
# - BERO_EVT paket çözümleme
# - BOOT_ID / EVENT_ID / STATE kayıtları
# - E19 olay kayıt sensörleri
# - UDP socket ve paket işleme kodları
#
# DONANIM BAĞLANTILARI:
# ESP32D2 GPIO21 -> ADS1115 SDA
# ESP32D2 GPIO22 -> ADS1115 SCL
# ESP32D2 3.3V   -> ADS1115 VDD
# ESP32D2 GND    -> ADS1115 GND
# ADS1115 ADDR   -> GND (0x48)
# SCT013 çıkışı  -> ADS1115 A0-A1
#
# ÖLÇÜM AYARLARI:
# ADS1115 çalışma modu : Continuous
# Diferansiyel kanal   : A0-A1
# PGA                  : 2.048 V
# ADS1115 veri hızı    : 860 SPS
# ct_clamp penceresi   : 200 ms
# Güncelleme aralığı   : 1 saniye
#
# KALİBRASYON:
# 27.60 katsayısı kaynak taslaktaki değerdir.
# Bu katsayının ADS1115 No.1 için doğrulandığı kabul edilmez.
#
# ALT EŞİK:
# 5 mA altındaki sonuçlar sıfırlanır.
#
# BEKLENEN ÇIKTI:
# Home Assistant:
# "BERO Akim Sensoru" – A cinsinden akım değeri.
#
# GÜVENLİK:
# ADS1115 girişlerinin her biri GND - 0.3 V ile
# VDD + 0.3 V sınırları içinde kalmalıdır.
# Diferansiyel ölçüm bu sınırı değiştirmez.
#
# DOĞRULAMA DURUMU:
# Bu dosya kullanıcı tarafından sağlanan taslağın
# paket okuma bölümleri çıkarılmış akım okuma sürümüdür.
# ESPHome derlemesi ve fiziksel cihaz testi yapılmamıştır.
# ============================================================

esphome:
  name: esp32d2
  friendly_name: ESP32D2
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 400kHz

ads1115:
  - address: 0x48
    continuous_mode: true

sensor:
  - platform: ads1115
    multiplexer: A0_A1
    gain: 2.048
    sample_rate: 860
    id: ads_sct_raw
    internal: true

  - platform: ct_clamp
    sensor: ads_sct_raw
    name: "BERO Akim Sensoru"
    id: bero_akim
    sample_duration: 200ms
    update_interval: 1s
    accuracy_decimals: 3

    filters:
      - calibrate_linear:
          - 0.0 -> 0.0
          - 1.0 -> 27.60

      - lambda: |-
          if (x < 0.005) return 0.0;
          return x;
