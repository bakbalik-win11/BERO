# ============================================================
# PROJE BERO — GRV-004 — ALT08
# Hedef: ADC ham veri toplama başlangıç testi
# Donanım: ESP32-D1
# GPIO32 = BIAS
# GPIO33 = K1
# GPIO34 = K2
# GPIO35 = K3
#
# Akım hesabı: YOK
# PZEM: YOK
# Örnekleme: 100 ms
# Durum: TEST ADAYI — KULLANICI DERLEMEYİ BAŞARILI BİLDİ
# ============================================================

esphome:
  name: esp32d1
  friendly_name: ESP32D1

  on_boot:
    priority: -100
    then:
      - lambda: |-
          ESP_LOGI("ALT08", "ALT08 ADC ham veri testi basladi");
          ESP_LOGI("ALT08", "GPIO32=BIAS GPIO33=K1 GPIO34=K2 GPIO35=K3");

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO
  baud_rate: 115200

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "ESP32D1-ALT08-Fallback"
    password: "bero-alt08-test"

captive_portal:

interval:
  - interval: 100ms
    then:
      - lambda: |-
          static uint32_t sample_no = 0;

          int bias = analogRead(32);
          int k1 = analogRead(33);
          int k2 = analogRead(34);
          int k3 = analogRead(35);

          ESP_LOGI(
            "ALT08_RAW",
            "n=%lu,bias=%d,k1=%d,k2=%d,k3=%d",
            (unsigned long) sample_no++,
            bias,
            k1,
            k2,
            k3
          );
