# SON LOG GÜNCELLEMESİ (2026-10-16 13:58–14:00):
# NTP sync OK; DS3231 init FAILED; I2C write register 0x00 FAILED.
# SSR cycle events continue; GPIO_ON_READBACK_MISMATCH observed.
# Next: inspect inverted GPIO6 readback logic and external DS3231 component source.
# Latest runtime evidence is documented in ../logs/2026-10-16_ESP32-C3-SSR_Build_Runtime_Log.md.
# PROJE BERO — HDF-002 / DEVAM KODU
# HEDEF:
# 1) NTP zamanını alıp DS3231'e yazma davranışını gözlemlemek.
# 2) RTC/NTP saatlerini ve olayları zaman damgalı loglamak.
# 3) SSR kontrol çevrimini 40 s ON / 20 s OFF sürdürmek.
# DONANIM: ESP32-C3 SuperMini, DS3231 I2C (0x68), SSR GPIO6.
# I2C: SDA GPIO0, SCL GPIO1, 50 kHz. ESPHome 2026.9.1 / ESP-IDF.
# SSR lojik denemesi: inverted: true (fiziksel doğrulama henüz yok).
# SINIR: RTC write hatası devam ediyor; COMMAND_SENT başarı teyidi değildir.
# GPIO pad geri okuması SSR'nin yük çıkışını kanıtlamaz.

esphome:
  name: esphome-web-0424f4
  friendly_name: ESP32-C3-SSR
  name_add_mac_suffix: false
  on_boot:
    - priority: -100
      then:
        - switch.turn_off: ssr_control
        - lambda: |-
            // Faz A: bu açılışa özel kimlik. Bu, RTC zamanından bağımsızdır.
            id(bero_boot_id) = esp_random();
            id(bero_event_id) = 0;
            ESP_LOGI("bero_event", "BERO_BOOT_ID=%08X EVENT_ID_START=0",
              (unsigned int) id(bero_boot_id));

            auto rtc_now = id(rtc_time).now();
            auto ntp_now = id(ntp_time).now();

            if (rtc_now.is_valid()) {
              ESP_LOGI("bero_boot_test",
                "BERO_BOOT_RTC_VALID: %04d-%02d-%02d %02d:%02d:%02d",
                rtc_now.year, rtc_now.month, rtc_now.day_of_month,
                rtc_now.hour, rtc_now.minute, rtc_now.second);
            } else {
              ESP_LOGW("bero_boot_test", "BERO_BOOT_RTC_INVALID");
            }

            if (ntp_now.is_valid()) {
              ESP_LOGI("bero_boot_test",
                "BERO_BOOT_NTP_VALID_AT_BOOT: %04d-%02d-%02d %02d:%02d:%02d",
                ntp_now.year, ntp_now.month, ntp_now.day_of_month,
                ntp_now.hour, ntp_now.minute, ntp_now.second);
            } else {
              ESP_LOGI("bero_boot_test", "BERO_BOOT_NTP_INVALID_AT_BOOT: waiting for NTP sync");
            }

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

external_components:
  - source: github://andrewbackway/esphome-ds3231@main
    components: [ds3231]
    refresh: 1d

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  id: bus_a
  sda: GPIO0
  scl: GPIO1
  scan: true
  frequency: 50kHz

time:
  - platform: sntp
    id: ntp_time
    timezone: Europe/Istanbul
    servers:
      - time.google.com
      - time.cloudflare.com
      - 0.pool.ntp.org
    on_time_sync:
      then:
        - logger.log:
            level: INFO
            format: "BERO_NTP_SYNC_OK: NTP time synchronized."
        - ds3231.write_time: rtc_time
        - logger.log:
            level: INFO
            format: "BERO_RTC_WRITE_COMMAND_SENT: DS3231 write action called."

  - platform: ds3231
    id: rtc_time
    i2c_id: bus_a
    address: 0x68
    update_interval: 10s
    timezone: Europe/Istanbul

switch:
  - platform: gpio
    id: ssr_control
    name: "BERO SSR Kontrol"
    pin:
      number: GPIO6
      inverted: true
    restore_mode: ALWAYS_OFF

globals:
  - id: bero_boot_id
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: bero_event_id
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ssr_cycle_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ssr_cycle_initialized
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - interval: 1s
    then:
      - lambda: |-
          #include "driver/gpio.h"
          #include "lwip/sockets.h"
          #include "lwip/inet.h"
          #include <errno.h>

          // RTC varsa olay zamanında RTC kullan; yoksa NTP; ikisi de yoksa NONE.
          auto log_event = [&](const char *event) {
            auto rtc = id(rtc_time).now();
            auto ntp = id(ntp_time).now();

            if (rtc.is_valid()) {
              ESP_LOGI("bero_event",
                "TIME=%04d-%02d-%02d %02d:%02d:%02d SOURCE=RTC EVENT=%s",
                rtc.year, rtc.month, rtc.day_of_month,
                rtc.hour, rtc.minute, rtc.second, event);
            } else if (ntp.is_valid()) {
              ESP_LOGI("bero_event",
                "TIME=%04d-%02d-%02d %02d:%02d:%02d SOURCE=NTP EVENT=%s",
                ntp.year, ntp.month, ntp.day_of_month,
                ntp.hour, ntp.minute, ntp.second, event);
            } else {
              ESP_LOGW("bero_event",
                "TIME=UNAVAILABLE SOURCE=NONE EVENT=%s", event);
            }
          };

          // Faz A: ortak olay kimliği. Her ON/OFF durum geçişinde bir kez artırılır.
          auto emit_shared_event = [&](const char *state) {
            id(bero_event_id)++;

            // UDP broadcast: ESP-SSR -> PZEM ESP, port 4210.
            // Keep this payload simple so it is easy to inspect in logs.
            char packet[128];
            snprintf(packet, sizeof(packet),
              "BERO_EVT,BOOT_ID=%08X,EVENT_ID=%u,STATE=%s",
              (unsigned int) id(bero_boot_id),
              (unsigned int) id(bero_event_id), state);

            static int udp_sock = -1;
            if (udp_sock < 0) {
              udp_sock = socket(AF_INET, SOCK_DGRAM, IPPROTO_UDP);
              if (udp_sock >= 0) {
                int broadcast_enable = 1;
                setsockopt(udp_sock, SOL_SOCKET, SO_BROADCAST,
                  &broadcast_enable, sizeof(broadcast_enable));
              } else {
                ESP_LOGW("bero_udp", "UDP_SOCKET_CREATE_FAILED errno=%d", errno);
              }
            }

            if (udp_sock >= 0) {
              struct sockaddr_in destination = {};
              destination.sin_family = AF_INET;
              destination.sin_port = htons(4210);
              destination.sin_addr.s_addr = inet_addr("255.255.255.255");
              int sent = sendto(udp_sock, packet, strlen(packet), 0,
                (struct sockaddr *)&destination, sizeof(destination));
              if (sent >= 0) {
                ESP_LOGI("bero_udp", "UDP_EVENT_SENT %s", packet);
              } else {
                ESP_LOGW("bero_udp", "UDP_SEND_FAILED errno=%d", errno);
              }
            }

            ESP_LOGI("bero_event",
              "BERO_SHARED_EVENT BOOT_ID=%08X EVENT_ID=%u STATE=%s",
              (unsigned int) id(bero_boot_id),
              (unsigned int) id(bero_event_id), state);
          };

          // Çevrim millis() ile ilerler; duvar saati senkronizasyonundan bağımsızdır.
          const uint32_t now_ms = millis();

          if (!id(ssr_cycle_initialized)) {
            id(ssr_cycle_start_ms) = now_ms;
            id(ssr_cycle_initialized) = true;

            emit_shared_event("ON");
            log_event("COMMAND_ON");
            id(ssr_control).turn_on();

            const int gpio_level = gpio_get_level(GPIO_NUM_6);
            if (gpio_level == 1) {
              log_event("GPIO_ON_CONFIRMED");
            } else {
              log_event("GPIO_ON_READBACK_MISMATCH");
            }
            log_event("CYCLE_START_ON_40S");
            return;
          }

          const uint32_t elapsed_s =
            (now_ms - id(ssr_cycle_start_ms)) / 1000;

          if (elapsed_s < 40) {
            if (!id(ssr_control).state) {
              emit_shared_event("ON");
              log_event("COMMAND_ON");
              id(ssr_control).turn_on();

              const int gpio_level = gpio_get_level(GPIO_NUM_6);
              if (gpio_level == 1) {
                log_event("GPIO_ON_CONFIRMED");
              } else {
                log_event("GPIO_ON_READBACK_MISMATCH");
              }
            }
          } else if (elapsed_s < 60) {
            if (id(ssr_control).state) {
              emit_shared_event("OFF");
              log_event("COMMAND_OFF");
              id(ssr_control).turn_off();

              const int gpio_level = gpio_get_level(GPIO_NUM_6);
              if (gpio_level == 0) {
                log_event("GPIO_OFF_CONFIRMED");
              } else {
                log_event("GPIO_OFF_READBACK_MISMATCH");
              }
            }
          } else {
            id(ssr_cycle_start_ms) = now_ms;

            emit_shared_event("ON");
            log_event("COMMAND_ON");
            id(ssr_control).turn_on();

            const int gpio_level = gpio_get_level(GPIO_NUM_6);
            if (gpio_level == 1) {
              log_event("GPIO_ON_CONFIRMED");
            } else {
              log_event("GPIO_ON_READBACK_MISMATCH");
            }
            log_event("CYCLE_RESTART_ON_40S");
          }

text_sensor:
  - platform: template
    name: "BERO NTP Saat"
    update_interval: 5s
    lambda: |-
      auto now = id(ntp_time).now();
      if (!now.is_valid()) {
        ESP_LOGW("ntp_test", "NTP_TIME_INVALID");
        return {"NTP_TIME_INVALID"};
      }
      char buffer[24];
      snprintf(buffer, sizeof(buffer), "%04d-%02d-%02d %02d:%02d:%02d",
        now.year, now.month, now.day_of_month, now.hour, now.minute, now.second);
      ESP_LOGI("ntp_test", "NTP_TIME: %s", buffer);
      return {buffer};

  - platform: template
    name: "BERO DS3231 RTC Saat"
    update_interval: 5s
    lambda: |-
      auto now = id(rtc_time).now();
      if (!now.is_valid()) {
        ESP_LOGW("rtc_test", "RTC_TIME_INVALID");
        return {"RTC_TIME_INVALID"};
      }
      char buffer[24];
      snprintf(buffer, sizeof(buffer), "%04d-%02d-%02d %02d:%02d:%02d",
        now.year, now.month, now.day_of_month, now.hour, now.minute, now.second);
      ESP_LOGI("rtc_test", "RTC_TIME: %s", buffer);
      return {buffer};

button:
  - platform: template
    name: "BERO DS3231 Saati NTP'den Yaz"
    on_press:
      then:
        - if:
            condition:
              time.has_time:
                id: ntp_time
            then:
              - logger.log:
                  level: INFO
                  format: "BERO_MANUAL_RTC_WRITE_START"
              - ds3231.write_time: rtc_time
              - logger.log:
                  level: INFO
                  format: "BERO_MANUAL_RTC_WRITE_COMMAND_SENT"
            else:
              - logger.log:
                  level: WARN
                  format: "BERO_MANUAL_RTC_WRITE_ABORTED: NTP time invalid."
