# ============================================================
# PROJE BERO — ESP32 WROOM / MODÜL 3 (SADECE PZEM-004T V3.0)
#
# KAYIT DURUMU:
# Sökülecek Modül 3'ten kalan arşiv yapılandırmasıdır.
# Aktif/üretim firmware'i olarak değerlendirilmez.
#
# AMAÇ:
# 1. PZEM-004T V3.0 ölçümlerini 5 saniye aralıkla
#    Home Assistant'a yayınlamak.
# 2. Aç/kapa kontrolü içermez; yalnızca ölçüm yapar.
#
# BAĞLANTILAR:
# PZEM TX   -> ESP32 GPIO18 (UART RX)
# PZEM RX   -> ESP32 GPIO19 (UART TX)
# PZEM Baud -> 9600
#
# BEKLENEN HOME ASSISTANT SENSÖRLERİ:
# Gerilim, Akım, Güç, Enerji, Frekans, Güç Faktörü
#
# NOT:
# Bu dosya kullanıcı tarafından sağlanan kodun arşiv kopyasıdır.
# Derleme veya fiziksel donanım testi bu kayıtla doğrulanmış değildir.
# ============================================================

esphome:
  name: bero-modul3-wroom
  friendly_name: BERO Modul 3 WROOM
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ============================================================
# PZEM-004T V3.0 — UART / MODBUS
# ============================================================

uart:
  id: pzem_uart
  tx_pin: GPIO19
  rx_pin: GPIO18
  baud_rate: 9600
  stop_bits: 1

modbus:
  uart_id: pzem_uart

# ============================================================
# PZEM SENSÖRLERİ (5s)
# ============================================================

sensor:
  - platform: pzemac
    voltage:
      name: "BERO PZEM Gerilim"

    current:
      name: "BERO PZEM Akım"

    power:
      name: "BERO PZEM Güç"

    energy:
      name: "BERO PZEM Enerji"

    frequency:
      name: "BERO PZEM Frekans"

    power_factor:
      name: "BERO PZEM Güç Faktörü"

    update_interval: 5s
